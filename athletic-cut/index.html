<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Athletic Cut — offline training tracker. One file, no accounts, no cloud.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Athletic Cut">
<title>Athletic Cut</title>
<style>
/* ============================================================================
   1. TOKENS  — "Scoreboard" direction. Dark-first, OLED near-black.
   ========================================================================== */
:root{
  color-scheme: dark light;

  --n-0:#0A0A0C; --n-1:#141418; --n-2:#1E1E24; --n-3:#2A2A32; --n-4:#3A3A44;
  --n-5:#65656F; --n-6:#8A8A96; --n-7:#B9B9C2; --n-8:#F4F4F1;

  --amber-fill:#FFB224; --amber-fill-press:#E69E14; --amber-text:#FFC65A;
  --amber-dim:#2A1E00;  --on-amber:#1A1200;
  --cyan-fill:#4DD2FF;  --cyan-text:#7DDFFF;  --cyan-dim:#071A22; --on-cyan:#001A24;
  --green-fill:#5BE28A; --green-text:#7CEBA3; --green-dim:#0C2A18;
  --red-fill:#B42318;   --red-text:#FF8585;   --red-dim:#2E0F0D;  --on-red:#FFF1F0;

  --bg:var(--n-0); --surface:var(--n-1); --surface-2:var(--n-2);
  --surface-press:var(--n-3); --surface-sel:var(--n-4);
  --line:#33333C; --line-ctrl:var(--n-5);
  --text:var(--n-8); --text-2:var(--n-7); --text-3:var(--n-6);

  --primary:var(--amber-fill); --primary-press:var(--amber-fill-press);
  --primary-ink:var(--amber-fill);   /* amber for NON-text graphics: strip, rings, charts */
  --on-primary:var(--on-amber); --primary-text:var(--amber-text); --primary-dim:var(--amber-dim);
  --primary-border:transparent;
  --rest:var(--cyan-fill); --on-rest:var(--on-cyan); --rest-text:var(--cyan-text); --rest-dim:var(--cyan-dim);
  --success:var(--green-fill); --success-text:var(--green-text); --success-dim:var(--green-dim);
  --danger:var(--red-fill); --on-danger:var(--on-red); --danger-text:var(--red-text); --danger-dim:var(--red-dim);
  --focus:var(--cyan-fill); --focus-inner:var(--n-8);
  --scrim:rgba(0,0,0,.72);

  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;

  --fs-hero:7rem; --fs-num-xl:4.5rem; --fs-num-lg:3.5rem; --fs-num-md:2rem;
  --fs-h1:1.75rem; --fs-h2:1.375rem; --fs-title:1.125rem; --fs-body:1.0625rem;
  --fs-label:.9375rem; --fs-cap:.8125rem;
  --lh-tight:1.05; --lh-num:1; --lh-body:1.4;
  --tracking-num:-.02em; --tracking-cap:.06em;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --s-8:32px; --s-10:40px; --s-12:48px; --s-16:64px;
  --gutter:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);

  --r-1:6px; --r-2:12px; --r-3:20px; --r-4:28px; --r-full:999px;
  --elev-2:0 -1px 0 var(--line);
  --elev-3:0 12px 32px rgba(0,0,0,.6);

  --d-instant:80ms; --d-fast:140ms; --d-base:220ms; --d-slow:320ms; --d-long:480ms;
  --ease-std:cubic-bezier(.2,0,0,1);
  --ease-decel:cubic-bezier(0,0,0,1);
  --ease-accel:cubic-bezier(.3,0,1,1);
  --ease-emph-in:cubic-bezier(.05,.7,.1,1);
  --ease-emph-out:cubic-bezier(.3,0,.8,.15);

  --tap-min:44px; --tap-ctrl:56px; --tap-big:64px; --tap-step:72px; --bar-h:56px;
}
/* Light palette — duplicated under both the media query and the explicit override,
   because CSS has no way to share a declaration block between the two. */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --n-0:#F3F3F0; --n-1:#FFFFFF; --n-2:#FFFFFF; --n-3:#E8E8E4; --n-4:#DCDCD7;
    --n-5:#8A8A93; --n-6:#5F5F69; --n-7:#4B4B55; --n-8:#121215;
    --line:#D6D6D1;
    --amber-text:#7A4500; --amber-dim:#FFF1D6; --primary-ink:#9C6300;
    --cyan-fill:#075F7D; --cyan-text:#055470; --cyan-dim:#DDF1F8; --on-cyan:#FFFFFF;
    --green-fill:#0F6B36; --green-text:#0F6B36; --green-dim:#E3F5EA;
    --red-fill:#B0261B; --red-text:#B0261B; --red-dim:#FDE7E5; --on-red:#FFFFFF;
    --focus:#0A7EA4; --focus-inner:#FFFFFF;
    --scrim:rgba(18,18,21,.5);
    --primary-border:var(--amber-text);
    --elev-2:0 -1px 0 var(--line),0 -4px 16px rgba(0,0,0,.06);
    --elev-3:0 12px 32px rgba(0,0,0,.18);
  }
}
:root[data-theme="light"]{
  --n-0:#F3F3F0; --n-1:#FFFFFF; --n-2:#FFFFFF; --n-3:#E8E8E4; --n-4:#DCDCD7;
  --n-5:#8A8A93; --n-6:#5F5F69; --n-7:#4B4B55; --n-8:#121215;
  --line:#D6D6D1;
  --amber-text:#7A4500; --amber-dim:#FFF1D6; --primary-ink:#9C6300;
  --cyan-fill:#075F7D; --cyan-text:#055470; --cyan-dim:#DDF1F8; --on-cyan:#FFFFFF;
  --green-fill:#0F6B36; --green-text:#0F6B36; --green-dim:#E3F5EA;
  --red-fill:#B0261B; --red-text:#B0261B; --red-dim:#FDE7E5; --on-red:#FFFFFF;
  --focus:#0A7EA4; --focus-inner:#FFFFFF;
  --scrim:rgba(18,18,21,.5);
  --primary-border:var(--amber-text);
  --elev-2:0 -1px 0 var(--line),0 -4px 16px rgba(0,0,0,.06);
  --elev-3:0 12px 32px rgba(0,0,0,.18);
}
@media (prefers-contrast: more){
  :root{ --line:var(--line-ctrl); --text-3:var(--n-7); }
}

/* ============================================================================
   2. RESET / BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:var(--fs-body); line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;
  border:1px solid transparent /* keeps a paintable edge under forced-colors */}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,p{margin:0}
svg{display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:var(--tracking-num)}
.cap{font-size:var(--fs-cap);font-weight:600;letter-spacing:var(--tracking-cap);
  text-transform:uppercase;color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{
  outline:2px solid var(--focus); outline-offset:2px;
  box-shadow:0 0 0 2px var(--focus-inner);
}
.app-shell{min-height:100dvh;display:flex;flex-direction:column}

/* ============================================================================
   3. LAYOUT
   ========================================================================== */
#app{flex:1;display:flex;flex-direction:column;min-height:100dvh}
.screen{
  flex:1; display:flex; flex-direction:column;
  padding:calc(var(--safe-t) + var(--s-2)) var(--gutter) 0;
  padding-left:max(var(--gutter),var(--safe-l));
  padding-right:max(var(--gutter),var(--safe-r));
}
.screen--nav{padding-bottom:calc(var(--bar-h) + var(--safe-b) + var(--s-4))}
.screen-head{display:flex;align-items:center;justify-content:space-between;
  min-height:var(--tap-min);gap:var(--s-2)}
.screen-title{font-size:var(--fs-h1);font-weight:800;letter-spacing:-.01em}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:var(--s-4)}
.stack-2{display:flex;flex-direction:column;gap:var(--s-2)}
.row{display:flex;align-items:center;gap:var(--s-3)}
.spacer{flex:1}

/* Bottom nav */
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface-2);box-shadow:var(--elev-2);
  padding-bottom:var(--safe-b);
}
@supports (backdrop-filter:blur(20px)){
  .navbar{background:color-mix(in srgb,var(--surface-2) 88%,transparent);backdrop-filter:blur(20px)}
}
@media (prefers-reduced-transparency: reduce){ .navbar{background:var(--surface-2);backdrop-filter:none} }
.navbar button{
  height:var(--bar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--text-3);font-size:var(--fs-cap);font-weight:600;
}
.navbar button[aria-current="page"]{color:var(--primary-text)}
.navbar .ico{width:22px;height:22px}

/* ============================================================================
   4. CONTROLS
   ========================================================================== */
.btn{
  min-height:var(--tap-big);width:100%;border-radius:var(--r-2);
  display:flex;align-items:center;justify-content:center;gap:var(--s-2);
  font-size:var(--fs-title);font-weight:700;letter-spacing:var(--tracking-cap);
  text-transform:uppercase;padding:0 var(--s-4);position:relative;overflow:hidden;
}
.btn--primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary-border)}
.btn--primary:active{background:var(--primary-press)}
.btn--rest{background:var(--rest);color:var(--on-rest)}
.btn--ghost{background:var(--surface-sel);color:var(--text);border-color:var(--line-ctrl)}
.btn--outline{background:transparent;border:1px solid var(--line-ctrl);color:var(--text)}
.btn--danger{background:var(--danger);color:var(--on-danger)}
.btn--sm{min-height:var(--tap-ctrl);font-size:var(--fs-label)}
.btn:disabled{opacity:.45}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
.backbtn{min-height:var(--tap-min);padding:0 var(--s-2);align-self:flex-start;
  color:var(--text-2);font-size:var(--fs-label);font-weight:600;
  display:inline-flex;align-items:center;gap:6px}
.backbtn:active{background:var(--surface-press);border-radius:var(--r-2)}
.donecard{background:var(--success-dim);border-radius:var(--r-3);padding:var(--s-4);
  display:flex;flex-direction:column;gap:var(--s-2)}
.linkbtn{min-height:var(--tap-min);padding:0 var(--s-1);color:var(--primary-text);
  font-size:var(--fs-body);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.iconbtn{
  width:var(--tap-min);height:var(--tap-min);border-radius:var(--r-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none;
}
.iconbtn:active{background:var(--surface-press)}
.iconbtn .ico{width:24px;height:24px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* Action band pinned to the thumb zone */
.actions{
  position:sticky;bottom:0;z-index:20;
  padding:var(--s-3) 0 calc(max(var(--safe-b),12px));
  background:linear-gradient(to top,var(--bg) 62%,transparent);
  display:flex;flex-direction:column;gap:var(--s-2);
}

/* Steppers */
.stepper-wrap{display:flex;flex-direction:column;gap:var(--s-1)}
.stepper{
  container-type:inline-size;
  display:grid;grid-template-columns:var(--tap-step) 1fr var(--tap-step);
  align-items:stretch;background:var(--surface);border:1px solid var(--line-ctrl);
  border-radius:var(--r-2);overflow:hidden;min-height:var(--tap-step);
}
.stepper button{display:flex;align-items:center;justify-content:center;color:var(--text)}
.stepper .step-btn{border-right:1px solid var(--line)}
.stepper .step-btn:last-child{border-right:0;border-left:1px solid var(--line)}
:root[data-hand="left"] .stepper .step-btn:first-child{order:3;border-right:0;border-left:1px solid var(--line)}
:root[data-hand="left"] .stepper .step-btn:last-child{order:1;border-left:0;border-right:1px solid var(--line)}
:root[data-hand="left"] .stepper .step-val{order:2}
:root[data-hand="left"] .runner-head-row{flex-direction:row-reverse}
.stepper .step-btn:active{background:var(--surface-press)}
.stepper .step-btn .ico{width:28px;height:28px;stroke-width:2.5}
.stepper .step-val{
  flex-direction:column;font-size:min(var(--fs-num-xl),26cqw);font-weight:800;line-height:var(--lh-num);
  padding:var(--s-2) var(--s-1);min-width:0;overflow:hidden;
}
.stepper--sm .step-val{font-size:min(var(--fs-num-lg),22cqw);font-weight:700}
.stepper--xs{min-height:var(--tap-ctrl);grid-template-columns:var(--tap-ctrl) 1fr var(--tap-ctrl)}
.stepper--xs .step-val{font-size:min(var(--fs-num-md),16cqw);font-weight:700}
.stepper--xs{min-height:var(--tap-ctrl)}
.stepper.is-suggested .step-val{color:var(--primary-text)}
.stepper .nudge{animation:nudge var(--d-instant) var(--ease-std)}
@keyframes nudge{50%{background:var(--surface-press)}}

/* Chips */
.chips{display:flex;gap:var(--s-2);flex-wrap:wrap}
.chips--scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:var(--s-1);
  scrollbar-width:none}
.chips--scroll::-webkit-scrollbar{display:none}
.chip{
  min-height:var(--tap-ctrl);min-width:62px;padding:0 var(--s-4);
  border-radius:var(--r-1);background:var(--surface-press);color:var(--text-2);
  font-size:var(--fs-h2);font-weight:700;display:flex;align-items:center;justify-content:center;
  flex:none;transition:background var(--d-fast) var(--ease-std),color var(--d-fast) var(--ease-std);
}
.chip--sm{min-height:var(--tap-min);font-size:var(--fs-label);font-weight:600;padding:0 var(--s-3)}
.chip[aria-checked="true"],.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{
  background:var(--primary-dim);color:var(--primary-text);
  box-shadow:inset 0 0 0 2px var(--primary-ink);
}
.chip.is-target{box-shadow:inset 0 0 0 2px var(--line-ctrl)}
.chip.is-target[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--primary-ink)}
.rpe-row{display:flex;gap:var(--s-2)}
.rpe-row .chip{flex:1 1 0;min-width:0;padding:0}
.seg{display:flex;background:var(--surface-press);border-radius:var(--r-2);padding:3px;gap:3px}
.seg button{flex:1;min-height:50px;border-radius:var(--r-1);font-size:var(--fs-label);
  font-weight:600;color:var(--text-2)}


/* Cards, tiles, rows */
.card{background:var(--surface);border-radius:var(--r-3);padding:var(--s-4)}
.card--dim{background:var(--primary-dim)}
.card--warn{background:var(--danger-dim)}
.card--good{background:var(--success-dim)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.tile{background:var(--surface);border-radius:var(--r-3);padding:var(--s-3);
  min-height:88px;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left}
.tile-val{font-size:var(--fs-num-md);font-weight:700;line-height:var(--lh-num)}
.listrow{
  width:100%;min-height:var(--tap-big);display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-2) var(--s-3);background:var(--surface);border-radius:var(--r-2);text-align:left;
}
.listrow:active{background:var(--surface-press)}
.listrow .ico{color:var(--text-3);flex:none}
.listrow-main{flex:1;min-width:0}
.listrow-title{font-size:var(--fs-title);font-weight:600;line-height:1.2}
.listrow-sub{font-size:var(--fs-label);color:var(--text-3)}
.divider{height:1px;background:var(--line);margin:var(--s-2) 0}

/* Checklist */
.check{
  width:100%;min-height:var(--tap-ctrl);display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-2) var(--s-3);border-radius:var(--r-2);background:var(--surface);text-align:left;
}
.check .box{width:28px;height:28px;border-radius:var(--r-full);border:2px solid var(--line-ctrl);flex:none;
  display:flex;align-items:center;justify-content:center;transition:background var(--d-fast) var(--ease-std)}
.check[aria-checked="true"] .box{background:var(--success);border-color:var(--success)}
.check .box .ico{width:18px;height:18px;opacity:0;transition:opacity var(--d-fast) var(--ease-std)}
.check[aria-checked="true"] .box .ico{stroke:var(--n-0);opacity:1}
.check[aria-checked="true"] .check-label{color:var(--text-2)}
.check-label{font-size:var(--fs-title);font-weight:600;flex:1}
.check-sub{font-size:var(--fs-label);color:var(--text-3);font-weight:400}

/* Sheets, scrim, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88dvh;
  background:var(--surface-2);border-radius:var(--r-4) var(--r-4) 0 0;
  box-shadow:var(--elev-3);display:flex;flex-direction:column;
  padding:var(--s-2) var(--gutter) calc(max(var(--safe-b),12px));
}
.sheet-handle{width:36px;height:4px;border-radius:var(--r-full);background:var(--line-ctrl);
  margin:var(--s-1) auto var(--s-3)}
.sheet-body{overflow-y:auto;display:flex;flex-direction:column;gap:var(--s-3)}
.sheet-title{font-size:var(--fs-h2);font-weight:700}
.toast{
  position:fixed;left:var(--gutter);right:var(--gutter);
  bottom:calc(var(--safe-b) + 88px);z-index:45;
  min-height:var(--tap-min);background:var(--surface-2);border-radius:var(--r-2);
  display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-3);
  box-shadow:var(--elev-3);font-size:var(--fs-label);
}
.toast .linkbtn{min-width:64px;justify-content:center}
.sheet .btn--outline{background:var(--surface-sel);border-color:transparent}
.sheet .field input,.sheet .field textarea,.sheet .field select{
  background:var(--surface-sel);border-color:transparent}
.sheet .figbox{background:var(--surface-press)}
.banner{background:var(--danger-dim);color:var(--danger-text);border-radius:var(--r-2);
  padding:var(--s-3);font-size:var(--fs-label);display:flex;align-items:center;gap:var(--s-3)}

/* Numeric pad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.pad button{min-height:var(--tap-big);border-radius:var(--r-2);background:var(--surface-sel);
  font-size:var(--fs-num-md);font-weight:700}
.pad-display{font-size:var(--fs-num-lg);font-weight:800;text-align:center;padding:var(--s-2) 0}

/* Forms (library/metrics only — never mid-session) */
.field{display:flex;flex-direction:column;gap:var(--s-1)}
.field input,.field textarea,.field select{
  min-height:var(--tap-ctrl);background:var(--surface);border:1px solid var(--line-ctrl);
  border-radius:var(--r-2);padding:0 var(--s-3);font-size:var(--fs-body);width:100%;
}
.field textarea{padding:var(--s-3);min-height:96px;resize:vertical;line-height:var(--lh-body)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);
  min-height:var(--tap-ctrl);width:100%;text-align:left;font-size:var(--fs-body)}
.switch .track{width:51px;height:31px;border-radius:var(--r-full);background:var(--surface-sel);
  flex:none;padding:2px;display:flex;transition:background var(--d-fast) var(--ease-std)}
.switch[aria-checked="true"] .track{background:var(--success)}
.switch[aria-checked="true"] .knob{background:var(--n-0)}
.switch .knob{width:27px;height:27px;border-radius:var(--r-full);background:var(--n-8);
  transition:transform var(--d-fast) var(--ease-std)}
.switch[aria-checked="true"] .knob{transform:translateX(20px);border:1px solid var(--line-ctrl)}
</style>
<style>
/* ============================================================================
   5. SESSION RUNNER
   ========================================================================== */
.runner{display:flex;flex-direction:column;min-height:100dvh;position:relative}
.runner-head{
  padding:calc(var(--safe-t) + var(--s-2)) var(--gutter) var(--s-2);
  display:flex;flex-direction:column;gap:var(--s-2);
  position:relative;z-index:31;background:var(--bg);
}
.runner.is-resting .runner-head{background:var(--rest-dim)}
.runner-head-row{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap-min)}
.runner-head-row .cap{flex:1;text-align:center;color:var(--text-2)}
.progstrip{display:flex;gap:3px;height:4px}
.progstrip .blk{flex:1;display:flex;gap:2px}
.progstrip .sg{flex:1;background:var(--line);border-radius:var(--r-full)}
.progstrip .sg.on{background:var(--primary-ink)}
.progstrip .blk.done .sg{background:var(--text-3)}
.runner-body{
  flex:1;display:flex;flex-direction:column;gap:var(--s-4);
  padding:var(--s-2) var(--gutter) 0;
}
.runner-body > .stack{flex:1;min-height:0}
.runner.is-resting .runner-body{opacity:.4;pointer-events:none}
.ex-head{display:flex;align-items:flex-start;gap:var(--s-2)}
.ex-name{font-size:var(--fs-h1);font-weight:800;line-height:var(--lh-tight);
  letter-spacing:-.01em}
.ex-head .ex-name{flex:1}
.ex-target{font-size:var(--fs-label);color:var(--text-2);margin-top:2px}
.ex-note{font-size:var(--fs-label);color:var(--text-3)}
.thumbbtn{width:var(--tap-min);height:var(--tap-min);border-radius:var(--r-2);
  background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none;
  color:var(--text-2)}
.thumbbtn svg{width:40px;height:40px}
.thumbbtn .body{stroke-width:5.5}
.thumbbtn .fig .f0,.listrow .fig .f0{opacity:0}
.thumbbtn .fig .f1,.listrow .fig .f1{opacity:1}
.thumbbtn .equip,.thumbbtn .fill{display:none}
.lastline{display:flex;align-items:baseline;gap:var(--s-2);flex-wrap:wrap;
  min-height:var(--tap-min);width:100%;text-align:left}
.lastline .lv{font-size:var(--fs-h2);font-weight:600}
.lastline .sugg{font-size:var(--fs-label);color:var(--primary-text);font-weight:600;margin-left:auto}
.lastline .allsets{flex-basis:100%;font-size:var(--fs-label);color:var(--text-3)}
.pairbar{display:flex;gap:var(--s-3);font-size:var(--fs-label)}
.pairbar .p{color:var(--text-3);display:flex;align-items:center;gap:6px}
.pairbar .p.on{color:var(--text);font-weight:600}
.pairbar .dot{width:8px;height:8px;border-radius:var(--r-full);background:currentColor}
.nextline{font-size:var(--fs-label);color:var(--rest-text);font-weight:600}
.setlist{display:flex;flex-direction:column;gap:var(--s-1)}
.setrow{display:flex;align-items:center;gap:var(--s-2);min-height:var(--tap-min);
  font-size:var(--fs-label);color:var(--text-2)}
.setrow .ok{color:var(--success-text);flex:none}
.setrow .ok .ico{width:18px;height:18px}
.setrow .sv{color:var(--text);font-weight:600}
.setrow .pr{color:var(--success-text);font-weight:700}
.setrow button{margin-left:auto;min-width:64px;min-height:var(--tap-min);
  color:var(--primary-text);font-size:var(--fs-label);font-weight:600}
.cuestrip{display:flex;flex-direction:column;gap:2px;font-size:var(--fs-label);color:var(--text-2)}
.cuestrip li{display:flex;gap:var(--s-2)}
.cuestrip li::before{content:"•";color:var(--text-3)}
.hint{font-size:var(--fs-cap);color:var(--text-3)}

/* Rest takeover */
.runner.is-resting{height:100dvh;overflow:hidden}
.restpanel{
  position:fixed;inset:0;z-index:30;background:var(--rest-dim);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--safe-t) + 76px) var(--gutter) calc(max(var(--safe-b),12px));
  gap:var(--s-3);
}
.restpanel .actions{background:linear-gradient(to top,var(--rest-dim) 62%,transparent)}
.rest-meta .r > span:not(.lbl){white-space:nowrap}
.restpanel > .cap{color:var(--rest-text);font-size:var(--fs-label)}
.dial{position:relative;width:min(340px,88vw);aspect-ratio:1;display:flex;
  align-items:center;justify-content:center;margin:var(--s-2) auto}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{stroke:var(--line-ctrl);opacity:.45;fill:none}
.dial .arc{stroke:var(--rest);fill:none;stroke-linecap:round;
  transition:stroke var(--d-base) var(--ease-std)}
.dial--work .arc{stroke:var(--primary-ink)}
.dial.is-final .arc{stroke:var(--primary-ink)}
.dial-num{font-size:clamp(4rem,28vw,7rem);font-weight:800;line-height:var(--lh-num);
  font-variant-numeric:tabular-nums slashed-zero;letter-spacing:var(--tracking-num);
  position:relative;z-index:1}
.dial-num.long{font-size:clamp(3.5rem,24vw,6rem)}
.dial.is-final .dial-num{color:var(--primary-text)}
.restpanel.is-go{background:var(--primary-dim)}
.restpanel.is-go .dial-num{color:var(--primary-text)}
.rest-meta{width:100%;display:flex;flex-direction:column;gap:var(--s-2);font-size:var(--fs-label)}
.rest-meta .lbl{color:var(--text-3)}
.rest-meta .nx{font-size:var(--fs-title);font-weight:600;color:var(--text)}
.rest-meta .r{display:flex;align-items:center;gap:var(--s-2)}
.rest-meta button{margin-left:auto;min-height:var(--tap-min);min-width:64px;
  color:var(--primary-text);font-weight:600}
.restpanel .actions{background:none;width:100%}
.sheet .actions{background:none}
.restbar{
  display:flex;align-items:center;gap:var(--s-3);width:100%;min-height:var(--tap-ctrl);
  background:var(--rest-dim);border-radius:var(--r-2);padding:0 var(--s-3);
  font-size:var(--fs-label);
}
.restbar.is-go{background:var(--primary-dim)}
.restbar .t{font-size:var(--fs-h2);font-weight:800;color:var(--text)}
.restbar.is-go .t{color:var(--primary-text)}
.restbar .n{color:var(--text-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.restbar button{min-height:var(--tap-min);min-width:var(--tap-min);color:var(--rest-text);font-weight:700}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:22px;height:8px;border-radius:var(--r-full);background:var(--line)}
.pips i.on{background:var(--primary-ink)}
.pips i.slow{background:var(--danger)}
.pips i.miss{background:var(--danger-dim);box-shadow:inset 0 0 0 1px var(--danger)}

/* Exercise figure */
.figbox{width:100%;aspect-ratio:16/9;background:var(--surface-2);border-radius:var(--r-3);
  display:flex;flex-direction:column;align-items:stretch;overflow:hidden;position:relative;
  padding:var(--s-2) var(--s-2) 0}
.figbox svg,.figbox video{width:100%;height:100%;flex:1;min-height:0;object-fit:contain}
.fig{color:var(--text)}
.fig .f1{opacity:0}
@media (prefers-reduced-motion: no-preference){
  .fig.anim .f0{animation:frameA 1.2s steps(1,end) infinite}
  .fig.anim .f1{animation:frameB 1.2s steps(1,end) infinite}
}
@keyframes frameA{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes frameB{0%,50%{opacity:0}50.01%,100%{opacity:1}}
.fig.frame1 .f0{opacity:0;animation:none}
.fig.frame1 .f1{opacity:1;animation:none}
.fig .equip{stroke:var(--text-3)}
.fig .fill{fill:var(--text-3);stroke:none}
.figlabel{flex:none;padding:var(--s-1) 0 var(--s-2);text-align:center}

/* ============================================================================
   6. CHARTS
   ========================================================================== */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--text-3);font-size:13px;font-family:var(--font-ui)}
.chart .c-raw{fill:var(--text-3);opacity:.7}
.chart .c-avg{stroke:var(--primary-ink);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .c-avg-dot{fill:var(--primary-ink)}
.chart .c-line{stroke:var(--text-2);stroke-width:2;fill:none}
.chart .c-band{fill:var(--primary-ink);opacity:.12}
.chart .c-scan{fill:var(--rest)}
.chart .c-lbl{fill:var(--text);font-size:13px;font-weight:700;font-family:var(--font-ui)}
.chart .s0{stroke:var(--primary-ink)} .chart .s0f{fill:var(--primary-ink)}
.chart .s1{stroke:var(--rest)}    .chart .s1f{fill:var(--rest)}
.chart .s2{stroke:var(--success)} .chart .s2f{fill:var(--success)}
.chart .s3{stroke:var(--text-2)}  .chart .s3f{fill:var(--text-2)}
.chart .bar{fill:var(--primary-ink)}
.chart .bar-bg{fill:var(--line)}
.meter{height:10px;border-radius:var(--r-full);background:var(--surface-press);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary-ink);border-radius:var(--r-full)}
.meter i.ok{background:var(--success)}
.statline{display:flex;align-items:baseline;gap:var(--s-2)}
.statline .v{font-size:var(--fs-num-md);font-weight:700}
.statline .d{font-size:var(--fs-label);font-weight:600}
.up{color:var(--success-text)} .down{color:var(--danger-text)}

/* ============================================================================
   7. MOTION (opt-in — the reduced-motion path is the default)
   ========================================================================== */
@media (prefers-reduced-motion: no-preference){
  .runner-body{transition:opacity var(--d-slow) var(--ease-std)}
  .btn:active{transform:scale(.97);transition:transform var(--d-instant) var(--ease-std)}
  .sheet{animation:sheetIn var(--d-base) var(--ease-decel)}
  .scrim{animation:fade var(--d-base) var(--ease-decel)}
  .restpanel{animation:panelIn var(--d-slow) var(--ease-emph-in)}
  .setrow.new{animation:rowIn var(--d-base) var(--ease-decel)}
  .toast{animation:toastIn 180ms var(--ease-decel)}
  .btn.is-logging::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    animation:sweep var(--d-long) var(--ease-std);
  }
  .dial.is-final .arc{animation:pulse 500ms ease-in-out 5}
}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes panelIn{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes rowIn{from{transform:translateY(-8px);opacity:0}}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){
  .setrow.new{animation:none}
}
@media (forced-colors: active){
  .btn,.chip,.card,.tile,.listrow,.stepper{border:1px solid CanvasText}
  .dial .arc,.dial .track{stroke:CanvasText}
  .progstrip .sg{border:1px solid CanvasText}
  .progstrip .sg.on{background:Highlight}
}

var AC = window.AC = {};

   -------------------------------------------------------------------------- */

  var LB_PER_KG = 2.2046226218;

  function uid(p) {
    return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  /* Local calendar day — never toISOString(), which shifts across timezones. */
  function todayKey(d) {
    d = d || new Date();

  }
  function parseKey(k) {
    var p = String(k).split('-');

    lbToKg: lbToKg, kgToLb: kgToLb, toLb: toLb, mean: mean,

/* --------------------------------------------------------------------------
   2. store + migrations
   -------------------------------------------------------------------------- */
AC.store = (function () {
  var LS_KEY = 'athletic-cut:v1';
  var LS_BACKUP = 'athletic-cut:v1:pre-migrate';
  var LS_PREIMPORT = 'athletic-cut:v1:pre-import';
  var SCHEMA_VERSION = 1;

  var state = null;
  var subs = [];
  var writeFailed = false;

  var MIGRATIONS = {

  };

  function migrate(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return AC.seed.freshState();

    if (typeof s.schemaVersion !== 'number') s.schemaVersion = 0;
    if (s.schemaVersion > SCHEMA_VERSION) {

      try { localStorage.setItem(LS_KEY + ':newer', JSON.stringify(s)); } catch (e) {}
      return AC.seed.freshState();
    }
    if (validate(s)) {
      try { localStorage.setItem(LS_KEY + ':damaged', JSON.stringify(s)); } catch (e) {}
      return AC.seed.freshState();
    }
    if (s.schemaVersion < SCHEMA_VERSION) {
      try { localStorage.setItem(LS_BACKUP, JSON.stringify(s)); } catch (e) { /* best effort */ }
      for (var v = s.schemaVersion; v < SCHEMA_VERSION; v++) {
        var fn = MIGRATIONS[v + 1];

  }

  function load() {
    var raw = null, txt = null;

    if (txt) {

      catch (e) {

        try {
          var bak = localStorage.getItem(LS_BACKUP);
          if (bak) raw = JSON.parse(bak);
        } catch (e2) { raw = null; }
        setTimeout(function () {
          AC.ui && AC.ui.toast(raw ? 'Recovered from the last backup.' : 'Saved data was unreadable — started fresh.', 6000);
        }, 400);
      }
    }

    if (!txt) save();

  }

    if (typeof st.schemaVersion === 'number' && st.schemaVersion > SCHEMA_VERSION) {

      if (typeof p.optionalDayId !== 'string') return bad('program.optionalDayId is missing.');
    }
    if (st.exercises !== undefined && st.exercises !== null &&

    }
    ['sessions', 'metrics', 'scans'].forEach(function () {});
    if (st.sessions !== undefined && st.sessions !== null && !Array.isArray(st.sessions)) return bad('sessions is not a list.');
    if (st.metrics !== undefined && st.metrics !== null && !Array.isArray(st.metrics)) return bad('metrics is not a list.');
    if (st.scans !== undefined && st.scans !== null && !Array.isArray(st.scans)) return bad('scans is not a list.');
    if (st.nutrition !== undefined && st.nutrition !== null &&
        (typeof st.nutrition !== 'object' || Array.isArray(st.nutrition))) return bad('nutrition is not an object.');
    var a = st.activeSession;
    if (a !== undefined && a !== null) {
      if (typeof a !== 'object' || !Array.isArray(a.blocks) || typeof a.blockIndex !== 'number' ||
          !Array.isArray(a.entries) || !Array.isArray(a.blockResults)) {
        return bad('activeSession is incomplete.');
      }
      if (a.timer !== null && a.timer !== undefined && typeof a.timer !== 'object') return bad('activeSession.timer is malformed.');
    }
    return null;
  }

  function importJSON(text) {
    var parsed;
    try { parsed = JSON.parse(text); }
    catch (e) { return Promise.resolve({ ok: false, error: 'Not valid JSON.' }); }
    if (!parsed || parsed.app !== 'athletic-cut') {
      return Promise.resolve({ ok: false, error: 'Not an Athletic Cut backup (missing app marker).' });
    }
    if (!parsed.state || typeof parsed.state !== 'object') {

    }
    if (typeof parsed.schemaVersion === 'number' && parsed.schemaVersion > SCHEMA_VERSION) {
      return Promise.resolve({ ok: false, error: 'schemaVersion ' + SCHEMA_VERSION + ' expected, got ' + parsed.schemaVersion + '.' });
    }
    var bad = validate(parsed.state);
    if (bad) return Promise.resolve({ ok: false, error: bad });

    return after.then(function () {
      subs.forEach(function (f) { f(state); });
      return { ok: true };
    }, function () {
      subs.forEach(function (f) { f(state); });
      return { ok: true };
    });
  }

  function summary(text) {
    try {
      var p = JSON.parse(text);
      if (!p || p.app !== 'athletic-cut' || !p.state) return null;
      return {
        date: (p.exportedAt || '').slice(0, 10),
        sessions: (p.state.sessions || []).length,
        metrics: (p.state.metrics || []).length,
        clips: p.clips ? Object.keys(p.clips).length : 0
      };
    } catch (e) { return null; }
  }

  return {
    LS_KEY: LS_KEY, SCHEMA_VERSION: SCHEMA_VERSION, MIGRATIONS: MIGRATIONS,
    validate: validate, migrate: migrate, load: load, get: get, save: save, update: update,
    subscribe: subscribe, reset: reset, exportJSON: exportJSON, importJSON: importJSON,
    summary: summary,
    writeFailed: function () { return writeFailed; },
    lastSaveMs: function () { return lastSaveMs; }
  };
})();

/* --------------------------------------------------------------------------
   3. io — download / file pick. No network.
   -------------------------------------------------------------------------- */
AC.io = (function () {
  function download(filename, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = AC.util.h('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  }
  function selectFallback(el) {
    if (!el) return false;
    try { el.focus(); el.select(); return document.execCommand('copy'); }
    catch (e) { return false; }
  }
  function copyText(text, fallbackEl) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { resolve(true); },
          function () { resolve(selectFallback(fallbackEl)); });
        return;
      }
      resolve(selectFallback(fallbackEl));
    });
  }
  function pickFile(accept) {
    return new Promise(function (resolve) {
      var input = AC.util.h('input', { type: 'file', accept: accept || '', style: 'position:fixed;left:-9999px' });
      document.body.appendChild(input);
      input.addEventListener('change', function () {
        var f = input.files && input.files[0];
        document.body.removeChild(input);
        resolve(f || null);
      });
      input.click();
    });
  }
  function readText(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result)); };
      r.onerror = function () { reject(r.error); };
      r.readAsText(file);
    });
  }
  return { download: download, copyText: copyText, pickFile: pickFile, readText: readText };
})();

    if (s2) parts.push(s2 + (s2 === 1 ? ' second' : ' seconds'));
    return parts.join(' ') || '0 seconds';
  }
  function nextSetSpoken(slot) {
    var b = AS() && AS().block;

    var d = b.draft || {};
    return 'Next: set ' + (b.setIndex + 1) +
      (d.load ? ', ' + d.load + ' ' + (d.unit === 'kg' ? 'kilos' : 'pounds') : '') +
      (d.reps ? ' times ' + d.reps : '') + '.';
  }
  function timerRemaining() {
    var a = AS();

  }

  /* Called every ticker frame. Handles all zero-crossings, including ones that
     happened while the tab was hidden. */
  function tick(force) {
    var a = AS();
    if (!a) return;
    var now = AC.ticker.now();
    var changed = false;
    if (a.block && a.block.mode === 'emom' && a.block.status === 'running') {
      var elapsed = now - a.block.startedAt;
      var minute = Math.floor(elapsed / 60000);
      if (minute > a.block.minute) {
        var upto = Math.min(minute, a.block.minutes);
        AC.store.update(function (s) { s.activeSession.block.minute = upto; });
        if (upto < a.block.minutes) {
          AC.audio.vibrate('minute');   /* the tone itself is already scheduled */
          U.announce('Minute ' + (upto + 1) + ' of ' + a.block.minutes + '.');
        }
        changed = true;
      }
      if (elapsed >= a.block.minutes * 60000 && a.block.status === 'running') {
        finishEmom();
        return;
      }
    }
    if (a.timer && a.timer.kind === 'rest' && !a.timer.fired) {
      var left = (a.timer.endAt - now) / 1000;
      if (left <= 60 && left > 10 && !a.timer.said60) {
        AC.store.update(function (s) { s.activeSession.timer.said60 = true; });
        U.announce('One minute left.');
      } else if (left <= 10 && left > 0 && !a.timer.said10) {
        AC.store.update(function (s) { s.activeSession.timer.said10 = true; });
        U.announce('Ten seconds.');
      }
    }
    if (a.timer && !a.timer.fired && now >= a.timer.endAt) {
      AC.store.update(function (s) { s.activeSession.timer.fired = true; });
      if (a.timer.kind !== 'emom') {
        AC.audio.beep(a.timer.kind === 'interval-effort' ? 'stop' : a.timer.kind === 'hold' ? 'done' : 'rest');
      }
      onTimerZero(a.timer.kind);
      changed = true;

    if (changed || force) emit();

  function onTimerZero(kind) {
    var a = AS();
    if (!a) return;
    if (kind === 'rest') {
      U.announce('Go.', true);
      setTimeout(function () {
        var cur = AS();
        if (cur && cur.timer && cur.timer.kind === 'rest' && cur.timer.fired) { endRest(); }
      }, 1500);
    } else if (kind === 'interval-effort') {
      startIntervalRest(AS().timer ? AS().timer.endAt : undefined);
    } else if (kind === 'interval-rest') {
      AC.store.update(function (s) {
        s.activeSession.block.status = 'ready-effort';
        s.activeSession.timer = null;
      });
      U.announce('Rest done. Next effort ready.', true);
    } else if (kind === 'hold') {
      logHold();
    } else if (kind === 'getset') {

    }
  }

  function endRest() {
    stopTimer();
    AC.store.update(function (s) {
      var b = s.activeSession.block;
      /* A finished block stays finished when its rest ends — the user decides
         whether to add another set or move on. */
      if (b && b.phase !== 'done' &&
          (b.mode === 'straight-sets' || b.mode === 'carry' || b.mode === 'rounds')) b.phase = 'input';
    });
    emit();
    setTimeout(function () {
      var btn = document.querySelector('.runner .actions .btn--primary');
      if (btn) try { btn.focus({ preventScroll: true }); } catch (e) {}

  }

  /* ---------- current view ---------- */
  function currentBlock() {
    var a = AS();

    var a = AS(), blk = currentBlock();

    return {

      load: (slot.loadType === 'bodyweight' || slot.loadType === 'none' || slot.loadType === 'band') ? null : (draft.load || 0),
      loadUnit: draft.unit || 'lb',

  function logSet(opts) {
    opts = opts || {};

      var slot = blk.items[b.slotIndex || 0];
      var entry = buildSetLog(blk, slot, b.draft, b.setIndex, opts.warmup);
      AC.store.update(function (s) {
        s.activeSession.entries.push(entry);
        var bb = s.activeSession.block;

      });
      AC.audio.beep('tick');
      var done = !opts.warmup && AS().block.setIndex >= slot.sets;
      if (done) {
        /* Stay in the block and hand the decision to the user: another set, or move on. */
        AC.store.update(function (s) { s.activeSession.block.phase = 'done'; });
        if (blk.restSeconds > 0) {
          startTimer('rest', blk.restSeconds, 'Rest');

        }

      }

        var bb = s.activeSession.block;

      });
      AC.audio.beep('tick');
      var nb = AS().block;
      if (nb.round >= (blk.rounds || 1)) {
        AC.store.update(function (s) { s.activeSession.block.phase = 'done'; });
        if (blk.restSeconds > 0) {
          startTimer('rest', blk.restSeconds, 'Rest');
          U.announce(blk.label + ' done, ' + blk.rounds + ' rounds. Rest ' + spokenTime(blk.restSeconds) + '.');
        }
        emit();
        return;
      }
      if (nb.itemIndex === 0 && blk.restSeconds > 0) {
        AC.store.update(function (s) { s.activeSession.block.phase = 'rest'; });
        startTimer('rest', blk.restSeconds, 'Rest');

  /* Derive a block's cursor from what is actually logged, so moving between

  function rebuildBlockState(aa, blockIndex) {
    var blk = aa.blocks[blockIndex];

    var mine = aa.entries.filter(function (e) { return e.blockId === blk.id && !e.isWarmup; });
    if (b.mode === 'straight-sets' || b.mode === 'carry') {

    } else if (b.mode === 'rounds') {

    var a = AS();

    return 'the previous block';
  }
  function undoLastSet() {
    var a = AS();

    var blk = currentBlock();
    if (blk && last.blockId !== blk.id) {
      /* The set belongs to the previous block: step back into it and rebuild. */
      var idx = -1;
      for (var i = 0; i < a.blocks.length; i++) if (a.blocks[i].id === last.blockId) idx = i;
      if (idx < 0) return;
      stopTimer();
      AC.store.update(function (st) {
        var aa = st.activeSession;
        aa.entries.pop();
        aa.blockIndex = idx;
        aa.blockResults = aa.blockResults.filter(function (r) { return r.blockId !== last.blockId; });
        aa.block = rebuildBlockState(aa, idx);
        aa.timer = null;
        var bb = aa.block;

          if (last.reps !== null) bb.draft.reps = last.reps;
          bb.draft.rpe = last.rpe;
          if (last.distanceM !== null) bb.draft.distanceM = last.distanceM;
          bb.draft.suggested = false;

    }
    stopTimer();
    AC.store.update(function (s) {
      var aa = s.activeSession;
      aa.entries.pop();
      var b = aa.block;
      if (b.mode === 'straight-sets' || b.mode === 'carry') {
        if (!last.isWarmup && b.setIndex > 0) b.setIndex--;
        b.phase = 'input';
        b.draft.load = last.load === null ? b.draft.load : last.load;
        b.draft.reps = last.reps === null ? b.draft.reps : last.reps;
        b.draft.rpe = last.rpe;
        if (last.distanceM !== null) b.draft.distanceM = last.distanceM;
        b.draft.suggested = false;
      } else if (b.mode === 'rounds') {
        if (b.itemIndex === 0) { if (b.round > 0) { b.round--; b.itemIndex = aa.blocks[aa.blockIndex].items.length - 1; } }
        else b.itemIndex--;
        b.phase = 'input';
        var it = aa.blocks[aa.blockIndex].items[b.itemIndex];
        var d = b.drafts[it.id];
        if (d) {

          if (last.reps !== null) d.reps = last.reps;

    emit();
  }

  function editLastSet(patch) {
    AC.store.update(function (s) {
      var e = s.activeSession.entries[s.activeSession.entries.length - 1];
      if (e) Object.assign(e, patch);
    });
    emit();
  }

  function substitute(exerciseId) {
    var a = AS(), blk = currentBlock();
    if (!a || !blk) return;
    var logged = a.entries.filter(function (e) { return e.blockId === blk.id; }).length;
    var b = a.block;
    var idx = b.mode === 'rounds' ? b.itemIndex : (b.slotIndex || 0);
    var slot = blk.items[idx];
    AC.store.update(function (s) {
      var bb = s.activeSession.blocks[s.activeSession.blockIndex];
      var sl = bb.items[idx];
      sl.exerciseId = exerciseId;
      s.activeSession.substitutions[sl.id] = exerciseId;
      var ex = s.exercises[exerciseId];
      if (ex) {

        else if (!ex.increment) sl.loadType = 'bodyweight';

      if (exerciseId === 'pull-up') {

        ? s.activeSession.block.drafts[sl.id] : s.activeSession.block.draft;
      var fresh = makeDraft(sl, s.activeSession.sessionId);

    emit();
  }

    var a = AS(), blk = currentBlock();

    AC.store.update(function (s) {
      var bb = s.activeSession.blocks[s.activeSession.blockIndex];
      bb.items = bb.alternateItems;
      bb.mode = bb.alternateMode || 'carry';
      bb.chosenAlternate = true;

      s.activeSession.block = initBlock(bb, s.activeSession.sessionId);
    });
    emit();
  }

  /* ---------- EMOM ---------- */
  var emomHandles = [];
  function startEmom() {
    var b = AS().block;
    var mins = b.minutes;
    var started = AC.ticker.now();
    AC.store.update(function (s) {
      s.activeSession.block.status = 'running';
      s.activeSession.block.startedAt = started;
      s.activeSession.block.minute = 0;
    });
    startTimer('emom', mins * 60, 'EMOM');
    /* Pre-schedule every top-of-minute cue on the audio clock so they still
       fire with the screen off, not only while the main thread is running. */
    scheduleEmomCues(started, mins);
    AC.audio.beep('go');
    U.announce('EMOM started. Minute 1 of ' + mins + '.');
    emit();
  }
  function scheduleEmomCues(startedAt, mins) {
    clearEmomCues();
    for (var m = 1; m < mins; m++) {
      var hnd = AC.audio.scheduleAt(startedAt + m * 60000, 'minute');
      if (hnd) emomHandles.push(hnd);
    }
    var done = AC.audio.scheduleAt(startedAt + mins * 60000, 'done');
    if (done) emomHandles.push(done);
  }
  function clearEmomCues() {
    emomHandles.forEach(function (h) { AC.audio.cancel(h); });
    emomHandles = [];
  }

  function addSet() {
    var a = AS(), blk = currentBlock();
    if (!a || !blk) return;
    var b = a.block;
    AC.store.update(function (s) {
      var aa = s.activeSession;
      var bb = aa.blocks[aa.blockIndex];
      if (b.mode === 'rounds') bb.rounds = (bb.rounds || 1) + 1;
      else bb.items[aa.block.slotIndex || 0].sets++;
      aa.block.phase = 'input';
    });
    if (b.mode !== 'rounds') {
      /* Carry the load forward and reset the reps to the prescribed target. */
      var slot = AS().blocks[AS().blockIndex].items[b.slotIndex || 0];
      AC.store.update(function (s) {
        var d = s.activeSession.block.draft;
        d.reps = targetReps(slot);
        d.rpe = null;
        d.suggested = false;
      });
    }
    emit();
  }
  function addRound() { addSet(); }
  function addedSets() {
    var a = AS(), blk = currentBlock();
    if (!a || !blk) return 0;
    if (a.block.mode === 'rounds') {
      var seed = seedBlock(blk.id);
      return seed ? (blk.rounds || 0) - (seed.rounds || 0) : 0;
    }
    var seedB = seedBlock(blk.id);
    if (!seedB) return 0;
    var i = a.block.slotIndex || 0;
    return (blk.items[i].sets || 0) - ((seedB.items[i] || {}).sets || 0);
  }
  function seedBlock(blockId) {
    var days = S().program.days, found = null;
    days.forEach(function (d) {
      var all = (d.blocks || []).concat((d.options || []).reduce(function (acc, o) { return acc.concat(o.blocks); }, []));
      all.forEach(function (b) { if (b.id === blockId) found = b; });
    });
    return found;
  }
  function markMissed() {

  }

    var a = AS(), blk = currentBlock();

    var slot = blk.items[0];

  /* ---------- intervals ---------- */

      load: null, loadUnit: 'lb', reps: null, rpe: null, distanceM: null,

    emit();
  }
  function lastEffort() { return Math.max(0, AS().block.effortIndex - 1); }
  function markSlower(isSlower) {
    AC.store.update(function (s) {
      var b = s.activeSession.block;
      var idx = Math.max(0, b.effortIndex - 1);
      var i = b.slower.indexOf(idx);
      if (isSlower && i < 0) b.slower.push(idx);
      if (!isSlower && i >= 0) b.slower.splice(i, 1);
      b.slower.sort(function (x, y) { return x - y; });
    });

  }

      .every(function (i) { return b.slower.indexOf(i) >= 0; });

  /* ---------- holds (timed circuit items) ---------- */

    AC.audio.beep('go');

    logSet();

  /* ---------- block transitions ---------- */
  function blockResult(blk, b) {
    var r = { blockId: blk.id, mode: b.mode };
    if (b.mode === 'checklist') r.checked = (b.checked || []).slice();
    if (b.mode === 'emom') {
      r.roundsCompleted = b.roundsCompleted || 0; r.roundsTarget = b.minutes; r.load = b.load;

  /* §4.3.7 — the header must never be the only route to an action. */
  function attachReachSwipe(el) {
    var x0 = 0, y0 = 0, s0 = 0, lx = 0, ly = 0, live = false;
    function start(x, y, target) {
      if (target && target.closest && target.closest('.stepper,.chip,button,input,textarea')) { live = false; return; }
      x0 = lx = x; y0 = ly = y; s0 = window.scrollY; live = true;
    }
    function end(x, y) {
      if (!live) return;
      live = false;
      if (Math.abs(window.scrollY - s0) > 8) return;      /* that was a scroll, not a swipe */
      if (y - y0 > 64 && Math.abs(x - x0) < 40) moreSheet();
    }
    /* Touch first: once the browser claims the vertical pan it fires
       pointercancel and pointerup never arrives. */
    el.addEventListener('touchstart', function (e) {
      var t = e.touches[0]; if (t) start(t.clientX, t.clientY, e.target);
    }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      var t = e.touches[0]; if (t) { lx = t.clientX; ly = t.clientY; }
    }, { passive: true });
    el.addEventListener('touchend', function (e) {
      var t = e.changedTouches && e.changedTouches[0];
      end(t ? t.clientX : lx, t ? t.clientY : ly);
    }, { passive: true });
    el.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'touch') start(e.clientX, e.clientY, e.target);
    });
    el.addEventListener('pointerup', function (e) {
      if (e.pointerType !== 'touch') end(e.clientX, e.clientY);
    });
  }
  function blockHeader(blk, b) {
    if (!blk) return '';
    var lbl = blk.label.toUpperCase();
    if (blk.mode === 'straight-sets' || blk.mode === 'carry') {
      var slot = blk.items[b.slotIndex || 0];
      var word = blk.mode === 'carry' ? 'TRIP' : 'SET';
      if (b.phase === 'done') return lbl + ' · ' + slot.sets + ' ' + word + 'S DONE';
      return lbl + ' · ' + word + ' ' + Math.min(b.setIndex + 1, slot.sets) + ' OF ' + slot.sets;
    }
    if (blk.mode === 'rounds') {
      if (b.phase === 'done') return lbl + ' · ' + blk.rounds + ' ROUNDS DONE';
      return lbl + ' · ROUND ' + Math.min(b.round + 1, blk.rounds) + ' OF ' + blk.rounds;
    }
    if (blk.mode === 'emom') return lbl + ' · EMOM ' + blk.emom.minutes + ' MIN';
    if (blk.mode === 'interval') {
      return lbl + ' · EFFORT ' + Math.min(b.effortIndex + 1, b.effortsTarget) + ' OF ' + b.effortsTarget;
    }
    return lbl + (blk.targetMinutes ? ' · ' + blk.targetMinutes + ' MIN' : '');
  }
  function progStrip() {
    var p = AC.engine.progress();
    var total = p.reduce(function (a, x) { return a + x.total; }, 0);

    var strip = h('div', { class: 'progstrip', role: 'progressbar', 'aria-valuenow': done,
      'aria-valuemin': 0, 'aria-valuemax': total, 'aria-label': 'Session progress' });
    p.forEach(function (x) {
      var g = h('div', { class: 'blk' + (x.past ? ' done' : ''), style: 'flex:' + x.total });
      for (var i = 0; i < x.total; i++) g.appendChild(h('div', { class: 'sg' + (i < x.done ? ' on' : '') }));
      strip.appendChild(g);
    });
    return strip;
  }

  function lastLine(slot, draft) {
    var s = AC.engine.suggestLoad(slot);

    wrap.appendChild(h('span', { class: 'cap', text: 'Last' }));
    if (!s.last) {
      wrap.appendChild(h('span', { class: 'lv', text: '—  first time' }));

      return wrap;
    }
    var l = s.last;
    var bits = [];
    var hasLoad = l.load !== null && l.load !== undefined;
    if (hasLoad) bits.push(fmtLoad(l.load, l.loadUnit));
    if (l.reps !== null) bits.push(hasLoad ? '× ' + l.reps : l.reps + ' reps');
    if (l.distanceM) bits.push('× ' + l.distanceM + ' m');
    if (l.seconds) bits.push(l.seconds + ' s');

    wrap.appendChild(h('span', { class: 'lv', text: bits.join(' ') }));
    if (s.suggested) wrap.appendChild(h('span', { class: 'sugg', text: '↑ ' + U.num(s.load, 0) + ' sugg.' }));

    var all = h('span', { class: 'allsets', hidden: true, text: s.lastSets.map(function (e) {

  function progressionHint(slot, inc, unit) {
    var t = slot.repsTarget;
    if (!inc || !t || t.kind !== 'reps' || !(t.max > t.min)) return null;

  function setsBlock(blk, b) {
    if (b.phase === 'done') return doneBlock(blk, b);
    var a = S().activeSession;
    var isRounds = blk.mode === 'rounds';
    var slot = isRounds ? blk.items[b.itemIndex] : blk.items[b.slotIndex || 0];
    var ex = S().exercises[slot.exerciseId];
    var draft = isRounds ? b.drafts[slot.id] : b.draft;

    if (isRounds && blk.sharedLoad) {

        h('div', { class: 'listrow-main' },

      wrap.appendChild(h('ul', { class: 'cuestrip' }, ex.cues.slice(0, 3).map(function (c) { return h('li', { text: c }); })));
    }
    wrap.appendChild(lastLine(slot, draft));

    var hasLoad = ['bodyweight', 'none', 'band'].indexOf(slot.loadType) < 0 && !blk.sharedLoad;
    if (hasLoad) {
      wrap.appendChild(loadStepper(slot, draft, function (v) { AC.engine.setDraft('load', v, slot.id); }));
    }
    if (blk.mode === 'carry' || slot.logMetric === 'distance') {
      wrap.appendChild(ui.stepper({ label: 'Distance', unit: 'm', value: draft.distanceM || 40, step: 5,
        min: 5, max: 400, size: 'sm', onChange: function (v) { AC.engine.setDraft('distanceM', v, slot.id); } }));
    } else if (slot.logMetric === 'time') {
      wrap.appendChild(ui.stepper({ label: 'Hold', unit: 's', value: draft.seconds || 30, step: 5,

    } else if (slot.repsTarget.kind === 'amrap') {

        step: 1, min: 0, max: 100, size: 'sm',

        onChange: function (v) { AC.engine.setDraft('reps', v, slot.id); } }));
    } else {
      wrap.appendChild(ui.stepper({ label: slot.repsTarget.kind === 'reps-each-side' ? 'Reps each side' : 'Reps',
        value: draft.reps || 0, step: 1, min: 0, max: 100, size: 'sm',
        onChange: function (v) { AC.engine.setDraft('reps', v, slot.id); } }));
    }
    wrap.appendChild(ui.rpePicker({ value: draft.rpe, target: slot.rpeTarget,
      onChange: function (v) { AC.engine.setDraft('rpe', v, slot.id); } }));

    var band = h('div', { class: 'actions' });

  function setList(blk, all) {

  function onLogged() {

    if (!a) return;

    var takeover = a.timer && a.timer.kind === 'rest' && !restCollapsed;
    if (last && !takeover) {

  function checklistBlock(blk, b) {

  function dial(opts) {
    var size = 260, r = 116, C = 2 * Math.PI * r;
    var d = h('div', { class: 'dial' });
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.setAttribute('aria-hidden', 'true');
    function circle(cls) {
      var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', size / 2); c.setAttribute('cy', size / 2); c.setAttribute('r', r);
      c.setAttribute('class', cls); c.setAttribute('stroke-width', 12); c.setAttribute('fill', 'none');
      return c;
    }
    var track = circle('track'), arc = circle('arc');
    arc.setAttribute('stroke-dasharray', C);
    arc.setAttribute('stroke-dashoffset', 0);
    svg.appendChild(track); svg.appendChild(arc);
    var numEl = h('div', { class: 'dial-num', role: 'timer', 'aria-atomic': 'true',
      'aria-label': opts.label || 'Time remaining', text: opts.text || '0' });
    d.appendChild(svg); d.appendChild(numEl);
    d.update = function (fraction, text, final) {

      if (numEl.textContent !== text) {

        numEl.classList.toggle('long', text.length > 3);
      }
      d.classList.toggle('is-final', !!final);
    };
    return d;
  }

      AC.store.update(function (s) {
        Object.keys(s.exercises).forEach(function (k) {
          var want = map[k] ? k : null;
          if (s.exercises[k].userClipRef !== want) { s.exercises[k].userClipRef = want; changed = true; }
        });
      });
      if (changed) AC.screens.render();
    });
  }, 0);
})();
</script>
