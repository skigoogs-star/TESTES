<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Athletic Cut — offline training tracker. One file, no accounts, no cloud.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Athletic Cut">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Athletic Cut</title>
<style>
/* ============================================================================
   1. TOKENS  — "Scoreboard" direction. Dark-first, OLED near-black.
   ========================================================================== */
:root{
  color-scheme: dark light;

  --n-0:#0A0A0C; --n-1:#141418; --n-2:#1E1E24; --n-3:#2A2A32; --n-4:#3A3A44;
  --n-5:#65656F; --n-6:#8A8A96; --n-7:#B9B9C2; --n-8:#F4F4F1;

  --amber-fill:#FFB224; --amber-fill-press:#E69E14; --amber-text:#FFC65A;
  --amber-dim:#2A1E00;  --on-amber:#1A1200;
  --cyan-fill:#4DD2FF;  --cyan-text:#7DDFFF;  --cyan-dim:#071A22; --on-cyan:#001A24;
  --green-fill:#5BE28A; --green-text:#7CEBA3; --green-dim:#0C2A18;
  --red-fill:#B42318;   --red-text:#FF8585;   --red-dim:#2E0F0D;  --on-red:#FFF1F0;

  --bg:var(--n-0); --surface:var(--n-1); --surface-2:var(--n-2);
  --surface-press:var(--n-3); --surface-sel:var(--n-4);
  --line:#33333C; --line-ctrl:var(--n-5);
  --text:var(--n-8); --text-2:var(--n-7); --text-3:var(--n-6);

  --primary:var(--amber-fill); --primary-press:var(--amber-fill-press);
  --primary-ink:var(--amber-fill);   /* amber for NON-text graphics: strip, rings, charts */
  --on-primary:var(--on-amber); --primary-text:var(--amber-text); --primary-dim:var(--amber-dim);
  --primary-border:transparent;
  --rest:var(--cyan-fill); --on-rest:var(--on-cyan); --rest-text:var(--cyan-text); --rest-dim:var(--cyan-dim);
  --success:var(--green-fill); --success-text:var(--green-text); --success-dim:var(--green-dim);
  --danger:var(--red-fill); --on-danger:var(--on-red); --danger-text:var(--red-text); --danger-dim:var(--red-dim);
  --focus:var(--cyan-fill); --focus-inner:var(--n-8);
  --scrim:rgba(0,0,0,.72);

  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;

  --fs-hero:7rem; --fs-num-xl:4.5rem; --fs-num-lg:3.5rem; --fs-num-md:2rem;
  --fs-h1:1.75rem; --fs-h2:1.375rem; --fs-title:1.125rem; --fs-body:1.0625rem;
  --fs-label:.9375rem; --fs-cap:.8125rem;
  --lh-tight:1.05; --lh-num:1; --lh-body:1.4;
  --tracking-num:-.02em; --tracking-cap:.06em;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --s-8:32px; --s-10:40px; --s-12:48px; --s-16:64px;
  --gutter:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);

  --r-1:6px; --r-2:12px; --r-3:20px; --r-4:28px; --r-full:999px;
  --elev-2:0 -1px 0 var(--line);
  --elev-3:0 12px 32px rgba(0,0,0,.6);

  --d-instant:80ms; --d-fast:140ms; --d-base:220ms; --d-slow:320ms; --d-long:480ms;
  --ease-std:cubic-bezier(.2,0,0,1);
  --ease-decel:cubic-bezier(0,0,0,1);
  --ease-accel:cubic-bezier(.3,0,1,1);
  --ease-emph-in:cubic-bezier(.05,.7,.1,1);
  --ease-emph-out:cubic-bezier(.3,0,.8,.15);

  --tap-min:44px; --tap-ctrl:56px; --tap-big:64px; --tap-step:72px; --bar-h:56px;
}
/* Light palette — duplicated under both the media query and the explicit override,
   because CSS has no way to share a declaration block between the two. */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --n-0:#F3F3F0; --n-1:#FFFFFF; --n-2:#FFFFFF; --n-3:#E8E8E4; --n-4:#DCDCD7;
    --n-5:#8A8A93; --n-6:#5F5F69; --n-7:#4B4B55; --n-8:#121215;
    --line:#D6D6D1;
    --amber-text:#7A4500; --amber-dim:#FFF1D6; --primary-ink:#9C6300;
    --cyan-fill:#075F7D; --cyan-text:#055470; --cyan-dim:#DDF1F8; --on-cyan:#FFFFFF;
    --green-fill:#0F6B36; --green-text:#0F6B36; --green-dim:#E3F5EA;
    --red-fill:#B0261B; --red-text:#B0261B; --red-dim:#FDE7E5; --on-red:#FFFFFF;
    --focus:#0A7EA4; --focus-inner:#FFFFFF;
    --scrim:rgba(18,18,21,.5);
    --primary-border:var(--amber-text);
    --elev-2:0 -1px 0 var(--line),0 -4px 16px rgba(0,0,0,.06);
    --elev-3:0 12px 32px rgba(0,0,0,.18);
  }
}
:root[data-theme="light"]{
  --n-0:#F3F3F0; --n-1:#FFFFFF; --n-2:#FFFFFF; --n-3:#E8E8E4; --n-4:#DCDCD7;
  --n-5:#8A8A93; --n-6:#5F5F69; --n-7:#4B4B55; --n-8:#121215;
  --line:#D6D6D1;
  --amber-text:#7A4500; --amber-dim:#FFF1D6; --primary-ink:#9C6300;
  --cyan-fill:#075F7D; --cyan-text:#055470; --cyan-dim:#DDF1F8; --on-cyan:#FFFFFF;
  --green-fill:#0F6B36; --green-text:#0F6B36; --green-dim:#E3F5EA;
  --red-fill:#B0261B; --red-text:#B0261B; --red-dim:#FDE7E5; --on-red:#FFFFFF;
  --focus:#0A7EA4; --focus-inner:#FFFFFF;
  --scrim:rgba(18,18,21,.5);
  --primary-border:var(--amber-text);
  --elev-2:0 -1px 0 var(--line),0 -4px 16px rgba(0,0,0,.06);
  --elev-3:0 12px 32px rgba(0,0,0,.18);
}
@media (prefers-contrast: more){
  :root{ --line:var(--line-ctrl); --text-3:var(--n-7); }
}

/* ============================================================================
   2. RESET / BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:var(--fs-body); line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;
  border:1px solid transparent /* keeps a paintable edge under forced-colors */}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,p{margin:0}
svg{display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:var(--tracking-num)}
.cap{font-size:var(--fs-cap);font-weight:600;letter-spacing:var(--tracking-cap);
  text-transform:uppercase;color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{
  outline:2px solid var(--focus); outline-offset:2px;
  box-shadow:0 0 0 2px var(--focus-inner);
}
.app-shell{min-height:100dvh;display:flex;flex-direction:column}

/* ============================================================================
   3. LAYOUT
   ========================================================================== */
#app{flex:1;display:flex;flex-direction:column;min-height:100dvh}
.screen{
  flex:1; display:flex; flex-direction:column;
  padding:calc(var(--safe-t) + var(--s-2)) var(--gutter) 0;
  padding-left:max(var(--gutter),var(--safe-l));
  padding-right:max(var(--gutter),var(--safe-r));
}
.screen--nav{padding-bottom:calc(var(--bar-h) + var(--safe-b) + var(--s-4))}
.screen-head{display:flex;align-items:center;justify-content:space-between;
  min-height:var(--tap-min);gap:var(--s-2)}
.screen-title{font-size:var(--fs-h1);font-weight:800;letter-spacing:-.01em}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen > .scroll{padding-bottom:var(--s-6)}
.stack{display:flex;flex-direction:column;gap:var(--s-4)}
.stack-2{display:flex;flex-direction:column;gap:var(--s-2)}
.row{display:flex;align-items:center;gap:var(--s-3)}
.spacer{flex:1}

/* Bottom nav */
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface-2);box-shadow:var(--elev-2);
  padding-bottom:var(--safe-b);
}
@supports (backdrop-filter:blur(20px)){
  .navbar{background:color-mix(in srgb,var(--surface-2) 88%,transparent);backdrop-filter:blur(20px)}
}
@media (prefers-reduced-transparency: reduce){ .navbar{background:var(--surface-2);backdrop-filter:none} }
.navbar button{
  height:var(--bar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--text-3);font-size:var(--fs-cap);font-weight:600;
}
.navbar button[aria-current="page"]{color:var(--primary-text)}
.navbar .ico{width:22px;height:22px}

/* ============================================================================
   4. CONTROLS
   ========================================================================== */
.btn{
  min-height:var(--tap-big);width:100%;border-radius:var(--r-2);
  display:flex;align-items:center;justify-content:center;gap:var(--s-2);
  font-size:var(--fs-title);font-weight:700;letter-spacing:var(--tracking-cap);
  text-transform:uppercase;padding:0 var(--s-4);position:relative;overflow:hidden;
}
.btn--primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary-border)}
.btn--primary:active{background:var(--primary-press)}
.btn--rest{background:var(--rest);color:var(--on-rest)}
.btn--ghost{background:var(--surface-sel);color:var(--text);border-color:var(--line-ctrl)}
.btn--outline{background:transparent;border:1px solid var(--line-ctrl);color:var(--text)}
.btn--danger{background:var(--danger);color:var(--on-danger)}
.btn--sm{min-height:var(--tap-ctrl);font-size:var(--fs-label)}
.btn:disabled{opacity:.45}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
.backbtn{min-height:var(--tap-min);padding:0 var(--s-2);align-self:flex-start;
  color:var(--text-2);font-size:var(--fs-label);font-weight:600;
  display:inline-flex;align-items:center;gap:6px}
.backbtn:active{background:var(--surface-press);border-radius:var(--r-2)}
.donecard{background:var(--success-dim);border-radius:var(--r-3);padding:var(--s-4);
  display:flex;flex-direction:column;gap:var(--s-2)}
.linkbtn{min-height:var(--tap-min);padding:0 var(--s-1);color:var(--primary-text);
  font-size:var(--fs-body);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.iconbtn{
  width:var(--tap-min);height:var(--tap-min);border-radius:var(--r-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none;
}
.iconbtn:active{background:var(--surface-press)}
.iconbtn .ico{width:24px;height:24px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* Action band pinned to the thumb zone */
.actions{
  position:sticky;bottom:0;z-index:20;
  padding:var(--s-3) 0 calc(max(var(--safe-b),12px));
  background:linear-gradient(to top,var(--bg) 86%,transparent);
  display:flex;flex-direction:column;gap:var(--s-2);
}

/* Steppers */
.stepper-wrap{display:flex;flex-direction:column;gap:var(--s-1)}
.stepper{
  container-type:inline-size;
  display:grid;grid-template-columns:var(--tap-step) 1fr var(--tap-step);
  align-items:stretch;background:var(--surface);border:1px solid var(--line-ctrl);
  border-radius:var(--r-2);overflow:hidden;min-height:var(--tap-step);
}
.stepper button{display:flex;align-items:center;justify-content:center;color:var(--text)}
.stepper .step-btn{border-right:1px solid var(--line)}
.stepper .step-btn:last-child{border-right:0;border-left:1px solid var(--line)}
:root[data-hand="left"] .stepper .step-btn:first-child{order:3;border-right:0;border-left:1px solid var(--line)}
:root[data-hand="left"] .stepper .step-btn:last-child{order:1;border-left:0;border-right:1px solid var(--line)}
:root[data-hand="left"] .stepper .step-val{order:2}
:root[data-hand="left"] .runner-head-row{flex-direction:row-reverse}
.stepper .step-btn:active{background:var(--surface-press)}
.stepper .step-btn .ico{width:28px;height:28px;stroke-width:2.5}
.stepper .step-val{
  flex-direction:column;font-size:min(var(--fs-num-xl),26cqw);font-weight:800;line-height:var(--lh-num);
  padding:var(--s-2) var(--s-1);min-width:0;overflow:hidden;
}
.stepper--sm .step-val{font-size:min(var(--fs-num-lg),22cqw);font-weight:700}
.stepper--xs{min-height:var(--tap-ctrl);grid-template-columns:var(--tap-ctrl) 1fr var(--tap-ctrl)}
.stepper--xs .step-val{font-size:min(var(--fs-num-md),16cqw);font-weight:700}
.stepper--xs{min-height:var(--tap-ctrl)}
.stepper.is-suggested .step-val{color:var(--primary-text)}
.stepper .nudge{animation:nudge var(--d-instant) var(--ease-std)}
@keyframes nudge{50%{background:var(--surface-press)}}

/* Chips */
.chips{display:flex;gap:var(--s-2);flex-wrap:wrap}
.chips--scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:var(--s-1);
  scrollbar-width:none}
.chips--scroll::-webkit-scrollbar{display:none}
.chip{
  min-height:var(--tap-ctrl);min-width:62px;padding:0 var(--s-4);
  border-radius:var(--r-1);background:var(--surface-press);color:var(--text-2);
  font-size:var(--fs-h2);font-weight:700;display:flex;align-items:center;justify-content:center;
  flex:none;transition:background var(--d-fast) var(--ease-std),color var(--d-fast) var(--ease-std);
}
.chip--sm{min-height:var(--tap-min);font-size:var(--fs-label);font-weight:600;padding:0 var(--s-3)}
.chip[aria-checked="true"],.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{
  background:var(--primary-dim);color:var(--primary-text);
  box-shadow:inset 0 0 0 2px var(--primary-ink);
}
.chip.is-target{box-shadow:inset 0 0 0 2px var(--line-ctrl)}
.chip.is-target[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--primary-ink)}
.rpe-row{display:flex;gap:var(--s-2)}
.rpe-row .chip{flex:1 1 0;min-width:0;padding:0}
.seg{display:flex;background:var(--surface-press);border-radius:var(--r-2);padding:3px;gap:3px}
.seg button{flex:1;min-height:50px;border-radius:var(--r-1);font-size:var(--fs-label);
  font-weight:600;color:var(--text-2)}


/* Cards, tiles, rows */
.card{background:var(--surface);border-radius:var(--r-3);padding:var(--s-4)}
.card--dim{background:var(--primary-dim)}
.card--warn{background:var(--danger-dim)}
.card--good{background:var(--success-dim)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.tile{background:var(--surface);border-radius:var(--r-3);padding:var(--s-3);
  min-height:88px;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left}
.tile-val{font-size:var(--fs-num-md);font-weight:700;line-height:var(--lh-num)}
.listrow{
  width:100%;min-height:var(--tap-big);display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-2) var(--s-3);background:var(--surface);border-radius:var(--r-2);text-align:left;
}
.listrow:active{background:var(--surface-press)}
.listrow .ico{color:var(--text-3);flex:none}
.listrow-main{flex:1;min-width:0}
.listrow-title{font-size:var(--fs-title);font-weight:600;line-height:1.2}
.listrow-sub{font-size:var(--fs-label);color:var(--text-3)}
.divider{height:1px;background:var(--line);margin:var(--s-2) 0}

/* Checklist */
.check{
  width:100%;min-height:var(--tap-ctrl);display:flex;align-items:center;gap:var(--s-3);
  padding:var(--s-2) var(--s-3);border-radius:var(--r-2);background:var(--surface);text-align:left;
}
.check .box{width:28px;height:28px;border-radius:var(--r-full);border:2px solid var(--line-ctrl);flex:none;
  display:flex;align-items:center;justify-content:center;transition:background var(--d-fast) var(--ease-std)}
.check[aria-checked="true"] .box{background:var(--success);border-color:var(--success)}
.check .box .ico{width:18px;height:18px;opacity:0;transition:opacity var(--d-fast) var(--ease-std)}
.check[aria-checked="true"] .box .ico{stroke:var(--n-0);opacity:1}
.check[aria-checked="true"] .check-label{color:var(--text-2)}
.check-label{font-size:var(--fs-title);font-weight:600;flex:1}
.check-sub{font-size:var(--fs-label);color:var(--text-3);font-weight:400}

/* Sheets, scrim, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88dvh;
  background:var(--surface-2);border-radius:var(--r-4) var(--r-4) 0 0;
  box-shadow:var(--elev-3);display:flex;flex-direction:column;
  padding:var(--s-2) var(--gutter) calc(max(var(--safe-b),12px));
}
.sheet-handle{width:36px;height:4px;border-radius:var(--r-full);background:var(--line-ctrl);
  margin:var(--s-1) auto var(--s-3)}
.sheet-body{overflow-y:auto;display:flex;flex-direction:column;gap:var(--s-3)}
.sheet-title{font-size:var(--fs-h2);font-weight:700}
.toast{
  position:fixed;left:var(--gutter);right:var(--gutter);
  bottom:calc(var(--safe-b) + 88px);z-index:45;
  min-height:var(--tap-min);background:var(--surface-2);border-radius:var(--r-2);
  display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-3);
  box-shadow:var(--elev-3);font-size:var(--fs-label);
}
.toast .linkbtn{min-width:64px;justify-content:center}
.sheet .btn--outline{background:var(--surface-sel);border-color:transparent}
.sheet .field input,.sheet .field textarea,.sheet .field select{
  background:var(--surface-sel);border-color:transparent}
.sheet .figbox{background:var(--surface-press)}
.banner{background:var(--danger-dim);color:var(--danger-text);border-radius:var(--r-2);
  padding:var(--s-3);font-size:var(--fs-label);display:flex;align-items:center;gap:var(--s-3)}

/* Numeric pad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.pad button{min-height:var(--tap-big);border-radius:var(--r-2);background:var(--surface-sel);
  font-size:var(--fs-num-md);font-weight:700}
.pad-display{font-size:var(--fs-num-lg);font-weight:800;text-align:center;padding:var(--s-2) 0}

/* Forms (library/metrics only — never mid-session) */
.field{display:flex;flex-direction:column;gap:var(--s-1)}
.field input,.field textarea,.field select{
  min-height:var(--tap-ctrl);background:var(--surface);border:1px solid var(--line-ctrl);
  border-radius:var(--r-2);padding:0 var(--s-3);font-size:var(--fs-body);width:100%;
}
.field textarea{padding:var(--s-3);min-height:96px;resize:vertical;line-height:var(--lh-body)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);
  min-height:var(--tap-ctrl);width:100%;text-align:left;font-size:var(--fs-body)}
.switch .track{width:51px;height:31px;border-radius:var(--r-full);background:var(--surface-sel);
  flex:none;padding:2px;display:flex;transition:background var(--d-fast) var(--ease-std)}
.switch[aria-checked="true"] .track{background:var(--success)}
.switch[aria-checked="true"] .knob{background:var(--n-0)}
.switch .knob{width:27px;height:27px;border-radius:var(--r-full);background:var(--n-8);
  transition:transform var(--d-fast) var(--ease-std)}
.switch[aria-checked="true"] .knob{transform:translateX(20px);border:1px solid var(--line-ctrl)}
</style>
<style>
/* ============================================================================
   5. SESSION RUNNER
   ========================================================================== */
.runner{display:flex;flex-direction:column;min-height:100dvh;position:relative}
.runner-head{
  padding:calc(var(--safe-t) + var(--s-2)) var(--gutter) var(--s-2);
  display:flex;flex-direction:column;gap:var(--s-2);
  position:relative;z-index:31;background:var(--bg);
}
.runner.is-resting .runner-head{background:var(--rest-dim)}

.figbox{width:100%;aspect-ratio:16/9;background:var(--surface-2);border-radius:var(--r-3);

/* saved/completed check (green) */

/* Home v2 */

/* Session v2: labelled phase bar */

.setcount{font-size:var(--fs-title);color:var(--text-2);font-weight:600;margin-top:2px}

.rest-saved{display:flex;align-items:center;gap:var(--s-2);font-weight:700;color:var(--success-text)}
.timer-kind{font-size:1.25rem;font-weight:800;letter-spacing:.12em}

.statrow{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:var(--hair);border-radius:var(--r-card)}

<script>
"use strict";
/* ===========================================================================
   ATHLETIC CUT — single-file offline trainer.
   No network, no accounts, no cloud. localStorage + IndexedDB (clips only).
   =========================================================================== */
var AC = window.AC = {};

/* --------------------------------------------------------------------------
   1. util
   -------------------------------------------------------------------------- */
AC.util = (function () {
  var LB_PER_KG = 2.2046226218;

  function uid(p) {
    return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  /* Local calendar day — never toISOString(), which shifts across timezones. */
  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function parseKey(k) {
    var p = String(k).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function addDays(k, n) {
    var d = parseKey(k); d.setDate(d.getDate() + n); return todayKey(d);
  }
  function dayIndex(k) {
    var p = String(k).split('-');
    return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }
  function keyFromIndex(i) {
    var d = new Date(i * 86400000);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }
  function daysBetween(a, b) { return dayIndex(b) - dayIndex(a); }
  /* ISO-8601 week, Monday-based, computed from local date parts. */
  function isoWeekKey(k) {
    var d = parseKey(k);
    var day = (d.getDay() + 6) % 7;          // Mon=0 … Sun=6
    d.setDate(d.getDate() - day + 3);        // Thursday of this week
    var year = d.getFullYear();
    var jan4 = new Date(year, 0, 4);
    var jan4day = (jan4.getDay() + 6) % 7;
    var week1Thu = new Date(year, 0, 4 - jan4day + 3);
    var wk = 1 + Math.round((d - week1Thu) / (7 * 86400000));
    return year + '-W' + pad2(wk);
  }
  function weekStart(k) {
    var d = parseKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return todayKey(d);
  }
  function weekKeyOffset(k, n) { return isoWeekKey(addDays(weekStart(k), n * 7)); }
  function fmtDate(k) {
    var d = parseKey(k);
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }
  function fmtDateLong(k) {
    var d = parseKey(k);
    return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.ceil(sec));
    if (sec < 60) return String(sec);
    return Math.floor(sec / 60) + ':' + pad2(sec % 60);
  }
  function fmtMs(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec / 60) + ':' + pad2(sec % 60);
  }
  function clamp(n, lo, hi) { return n < lo ? lo : n > hi ? hi : n; }
  function roundTo(n, step) { return Math.round(n / step) * step; }
  function num(n, dp) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    var v = dp === undefined ? n : +(+n).toFixed(dp);
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function lbToKg(v) { return v / LB_PER_KG; }
  function kgToLb(v) { return v * LB_PER_KG; }
  function toLb(v, unit) { return unit === 'kg' ? kgToLb(v) : v; }
  function mean(arr) {
    var v = arr.filter(function (x) { return typeof x === 'number' && !isNaN(x); });
    if (!v.length) return null;
    return v.reduce(function (a, b) { return a + b; }, 0) / v.length;
  }

  /* Tiny DOM builder. Text children are always set via textContent (never HTML),
     so nothing the user types can ever be parsed as markup. */
  function h(tag, attrs) {
    var e = document.createElement(tag), k, v;
    if (attrs) for (k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'style') e.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (k === 'dataset') { for (var d in v) e.dataset[d] = v[d]; }
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
    return e;
  }
  function append(parent, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(parent, c); }); return; }
    parent.appendChild(child.nodeType ? child : document.createTextNode(String(child)));
  }
  function svgUse(id, cls) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('class', cls || 'ico');
    s.setAttribute('aria-hidden', 'true');
    s.setAttribute('focusable', 'false');
    var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    u.setAttribute('href', '#' + id);
    s.appendChild(u);
    return s;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  function announce(msg, assertive) {
    var el = document.getElementById(assertive ? 'sr-alert' : 'sr-status');
    if (!el) return;
    el.textContent = '';
    setTimeout(function () { el.textContent = msg; }, 30);
  }
  var reduceMotion = (function () {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)'); }
    catch (e) { return { matches: false }; }
  })();

  return {
    uid: uid, pad2: pad2, todayKey: todayKey, parseKey: parseKey, addDays: addDays,
    dayIndex: dayIndex, keyFromIndex: keyFromIndex, daysBetween: daysBetween, isoWeekKey: isoWeekKey, weekStart: weekStart,
    weekKeyOffset: weekKeyOffset, fmtDate: fmtDate, fmtDateLong: fmtDateLong,
    fmtClock: fmtClock, fmtMs: fmtMs, clamp: clamp, roundTo: roundTo, num: num,
    lbToKg: lbToKg, kgToLb: kgToLb, toLb: toLb, mean: mean,
    h: h, svgUse: svgUse, clear: clear, announce: announce,
    reduceMotion: reduceMotion, LB_PER_KG: LB_PER_KG
  };
})();

/* --------------------------------------------------------------------------
   2. store + migrations
   -------------------------------------------------------------------------- */
AC.store = (function () {
  var LS_KEY = 'athletic-cut:v1';
  var LS_BACKUP = 'athletic-cut:v1:pre-migrate';
  var LS_PREIMPORT = 'athletic-cut:v1:pre-import';
  var SCHEMA_VERSION = 1;

  var state = null;
  var subs = [];
  var writeFailed = false;
  var lastSaveMs = 0;

  var MIGRATIONS = {
    /* 1: initial schema. Future: 2: function (s) { …; s.schemaVersion = 2; return s; } */
  };

  function migrate(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return AC.seed.freshState();
    var s = raw;
    if (typeof s.schemaVersion !== 'number') s.schemaVersion = 0;
    if (s.schemaVersion > SCHEMA_VERSION) {
      /* Keep the newer blob rather than destroying it silently. */
      try { localStorage.setItem(LS_KEY + ':newer', JSON.stringify(s)); } catch (e) {}
      return AC.seed.freshState();
    }
    if (validate(s)) {
      try { localStorage.setItem(LS_KEY + ':damaged', JSON.stringify(s)); } catch (e) {}
      return AC.seed.freshState();
    }
    if (s.schemaVersion < SCHEMA_VERSION) {
      try { localStorage.setItem(LS_BACKUP, JSON.stringify(s)); } catch (e) { /* best effort */ }
      for (var v = s.schemaVersion; v < SCHEMA_VERSION; v++) {
        var fn = MIGRATIONS[v + 1];
        s = fn ? fn(s) : (s.schemaVersion = v + 1, s);
      }
    }
    return AC.seed.reconcile(s);
  }

  function load() {
    var raw = null, txt = null;
    try { txt = localStorage.getItem(LS_KEY); } catch (e) { txt = null; }
    if (txt) {
      try { raw = JSON.parse(txt); }
      catch (e) {
        raw = null;
        /* Fall back to the pre-migration backup before giving up on the user's history. */
        try {
          var bak = localStorage.getItem(LS_BACKUP);
          if (bak) raw = JSON.parse(bak);
        } catch (e2) { raw = null; }
        setTimeout(function () {
          AC.ui && AC.ui.toast(raw ? 'Recovered from the last backup.' : 'Saved data was unreadable — started fresh.', 6000);
        }, 400);
      }
    }
    state = migrate(raw);
    if (!txt) save();
    return state;
  }
  function get() { return state || load(); }

  function save() {
    if (!state) return;
    state.updatedAt = new Date().toISOString();
    var t0 = performance.now();
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      if (writeFailed) { writeFailed = false; notifyWrite(); }
    } catch (e) {
      if (!writeFailed) { writeFailed = true; notifyWrite(); }
      else writeFailed = true;
    }
    lastSaveMs = performance.now() - t0;
  }
  function notifyWrite() {
    document.dispatchEvent(new CustomEvent('ac:writestate', { detail: { failed: writeFailed } }));
  }
  function update(fn) {
    var s = get();
    fn(s);
    save();
    subs.forEach(function (f) { f(s); });
    return s;
  }
  function subscribe(fn) { subs.push(fn); return function () { subs = subs.filter(function (f) { return f !== fn; }); }; }

  function reset() {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    state = AC.seed.freshState();
    save();
    return state;
  }

  function exportJSON(opts) {
    opts = opts || {};
    var payload = {
      app: 'athletic-cut',
      exportedAt: new Date().toISOString(),
      schemaVersion: SCHEMA_VERSION,
      state: get()
    };
    if (!opts.includeClips) return Promise.resolve(JSON.stringify(payload, null, 2));
    return AC.media.exportClips().then(function (clips) {
      payload.clips = clips;
      return JSON.stringify(payload, null, 2);
    });
  }

  /* Structural validation. A backup that passes the app marker can still be junk;
     persisting junk bricks every future boot, so reject before writing. */
  function validate(st) {
    function bad(m) { return m; }
    if (!st || typeof st !== 'object' || Array.isArray(st)) return bad('State is not an object.');
    if (typeof st.schemaVersion === 'number' && st.schemaVersion > SCHEMA_VERSION) {
      return bad('schemaVersion ' + SCHEMA_VERSION + ' expected, got ' + st.schemaVersion + '.');
    }
    var p = st.program;
    if (p !== undefined && p !== null) {
      if (typeof p !== 'object' || !Array.isArray(p.days) || !p.days.length) return bad('program.days is missing or empty.');
      if (!Array.isArray(p.requiredDayIds) || p.requiredDayIds.length < 1) return bad('program.requiredDayIds is missing.');
      if (typeof p.optionalDayId !== 'string') return bad('program.optionalDayId is missing.');
    }
    if (st.exercises !== undefined && st.exercises !== null &&
        (typeof st.exercises !== 'object' || Array.isArray(st.exercises))) return bad('exercises is not an object.');
    if (st.schedule !== undefined && st.schedule !== null) {
      var n = st.schedule.nextRequiredIndex;
      var len = (p && p.requiredDayIds) ? p.requiredDayIds.length : 4;
      if (typeof n !== 'number' || n < 0 || n >= len || n !== Math.floor(n)) return bad('schedule.nextRequiredIndex is out of range.');
    }
    ['sessions', 'metrics', 'scans'].forEach(function () {});
    if (st.sessions !== undefined && st.sessions !== null && !Array.isArray(st.sessions)) return bad('sessions is not a list.');
    if (st.metrics !== undefined && st.metrics !== null && !Array.isArray(st.metrics)) return bad('metrics is not a list.');
    if (st.scans !== undefined && st.scans !== null && !Array.isArray(st.scans)) return bad('scans is not a list.');
    if (st.nutrition !== undefined && st.nutrition !== null &&
        (typeof st.nutrition !== 'object' || Array.isArray(st.nutrition))) return bad('nutrition is not an object.');
    var a = st.activeSession;
    if (a !== undefined && a !== null) {
      if (typeof a !== 'object' || !Array.isArray(a.blocks) || typeof a.blockIndex !== 'number' ||
          !Array.isArray(a.entries) || !Array.isArray(a.blockResults)) {
        return bad('activeSession is incomplete.');
      }
      if (a.timer !== null && a.timer !== undefined && typeof a.timer !== 'object') return bad('activeSession.timer is malformed.');
    }
    return null;
  }

  function importJSON(text) {
    var parsed;
    try { parsed = JSON.parse(text); }
    catch (e) { return Promise.resolve({ ok: false, error: 'Not valid JSON.' }); }
    if (!parsed || parsed.app !== 'athletic-cut') {
      return Promise.resolve({ ok: false, error: 'Not an Athletic Cut backup (missing app marker).' });
    }
    if (!parsed.state || typeof parsed.state !== 'object') {
      return Promise.resolve({ ok: false, error: 'Backup has no state object.' });
    }
    if (typeof parsed.schemaVersion === 'number' && parsed.schemaVersion > SCHEMA_VERSION) {
      return Promise.resolve({ ok: false, error: 'schemaVersion ' + SCHEMA_VERSION + ' expected, got ' + parsed.schemaVersion + '.' });
    }
    var bad = validate(parsed.state);
    if (bad) return Promise.resolve({ ok: false, error: bad });
    var previous = state;
    try {
      try { localStorage.setItem(LS_PREIMPORT, JSON.stringify(get())); } catch (e) {}
      state = migrate(parsed.state);
      save();
    } catch (e) {
      state = previous;
      return Promise.resolve({ ok: false, error: 'That backup could not be read: ' + (e && e.message ? e.message : e) });
    }
    var after = parsed.clips ? AC.media.importClips(parsed.clips) : Promise.resolve();
    return after.then(function () {
      subs.forEach(function (f) { f(state); });
      return { ok: true };
    }, function () {
      subs.forEach(function (f) { f(state); });
      return { ok: true };
    });
  }

  function summary(text) {
    try {

/* --------------------------------------------------------------------------
   3. io — download / file pick. No network.
   -------------------------------------------------------------------------- */
AC.io = (function () {
  function download(filename, text) {
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = AC.util.h('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  }
  function selectFallback(el) {
    if (!el) return false;
    try { el.focus(); el.select(); return document.execCommand('copy'); }
    catch (e) { return false; }
  }
  function copyText(text, fallbackEl) {
    return new Promise(function (resolve) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { resolve(true); },
          function () { resolve(selectFallback(fallbackEl)); });
        return;
      }
      resolve(selectFallback(fallbackEl));
    });
  }
  function pickFile(accept) {
    return new Promise(function (resolve) {
      var input = AC.util.h('input', { type: 'file', accept: accept || '', style: 'position:fixed;left:-9999px' });
      document.body.appendChild(input);
      input.addEventListener('change', function () {
        var f = input.files && input.files[0];
        document.body.removeChild(input);
        resolve(f || null);
      });
      input.click();
    });
  }
  function readText(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result)); };
      r.onerror = function () { reject(r.error); };
      r.readAsText(file);
    });
  }
  return { download: download, copyText: copyText, pickFile: pickFile, readText: readText };
})();

  /* ---------- EMOM ---------- */

    var day = dayById(a.dayId);

    else if (blk.mode === 'checklist') body.appendChild(checklistBlock(blk, b));

  /* §4.3.7 — the header must never be the only route to an action. */
  function attachReachSwipe(el) {
    var x0 = 0, y0 = 0, s0 = 0, lx = 0, ly = 0, live = false;
    function start(x, y, target) {
      if (target && target.closest && target.closest('.stepper,.chip,button,input,textarea')) { live = false; return; }
      x0 = lx = x; y0 = ly = y; s0 = window.scrollY; live = true;
    }
    function end(x, y) {
      if (!live) return;
      live = false;
      if (Math.abs(window.scrollY - s0) > 8) return;      /* that was a scroll, not a swipe */
      if (y - y0 > 64 && Math.abs(x - x0) < 40) moreSheet();
    }
    /* Touch first: once the browser claims the vertical pan it fires
       pointercancel and pointerup never arrives. */
    el.addEventListener('touchstart', function (e) {
      var t = e.touches[0]; if (t) start(t.clientX, t.clientY, e.target);
    }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      var t = e.touches[0]; if (t) { lx = t.clientX; ly = t.clientY; }
    }, { passive: true });
    el.addEventListener('touchend', function (e) {
      var t = e.changedTouches && e.changedTouches[0];
      end(t ? t.clientX : lx, t ? t.clientY : ly);
    }, { passive: true });
    el.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'touch') start(e.clientX, e.clientY, e.target);
    });
    el.addEventListener('pointerup', function (e) {
      if (e.pointerType !== 'touch') end(e.clientX, e.clientY);
    });
  }
  function blockHeader(blk, b) {
    if (!blk) return '';
    var lbl = blk.label.toUpperCase();
    if (blk.mode === 'straight-sets' || blk.mode === 'carry') {
      var slot = blk.items[b.slotIndex || 0];
      var word = blk.mode === 'carry' ? 'TRIP' : 'SET';
      if (b.phase === 'done') return lbl + ' · ' + slot.sets + ' ' + word + 'S DONE';
      return lbl + ' · ' + word + ' ' + Math.min(b.setIndex + 1, slot.sets) + ' OF ' + slot.sets;
    }
    if (blk.mode === 'rounds') {
      if (b.phase === 'done') return lbl + ' · ' + blk.rounds + ' ROUNDS DONE';
      return lbl + ' · ROUND ' + Math.min(b.round + 1, blk.rounds) + ' OF ' + blk.rounds;
    }
    if (blk.mode === 'emom') return lbl + ' · EMOM ' + blk.emom.minutes + ' MIN';
    if (blk.mode === 'interval') {
      return lbl + ' · EFFORT ' + Math.min(b.effortIndex + 1, b.effortsTarget) + ' OF ' + b.effortsTarget;
    }
    return lbl + (blk.targetMinutes ? ' · ' + blk.targetMinutes + ' MIN' : '');

  /* Labelled phase bar: Prep · Lift · Superset · Finish · Mobility (from the session's own blocks). */

  function lastLine(slot, draft) {

      h('span', { class: 'sugg', text: 'optional ▾' }));

  /* Exercise history on the lift screen: last 3 sessions, best set, a small trend. */
  function sparkline(vals) {

    if (v.length < 2) return null;
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), w = 72, hgt = 22;
    var pts = v.map(function (x, i) { return (i * w / (v.length - 1)).toFixed(1) + ',' + (hi === lo ? hgt / 2 : hgt - 2 - (x - lo) / (hi - lo) * (hgt - 4)).toFixed(1); });

    svg.innerHTML = '<polyline points="' + pts.join(' ') + '"/>';

  function liftHistorySheet(slot, hh) {

  function dial(opts) {
    var size = 260, r = 116, C = 2 * Math.PI * r;
    var d = h('div', { class: 'dial' });

    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.setAttribute('aria-hidden', 'true');
    function circle(cls) {
      var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', size / 2); c.setAttribute('cy', size / 2); c.setAttribute('r', r);
      c.setAttribute('class', cls); c.setAttribute('stroke-width', 12); c.setAttribute('fill', 'none');
      return c;
    }
    var track = circle('track'), arc = circle('arc');
    arc.setAttribute('stroke-dasharray', C);
    arc.setAttribute('stroke-dashoffset', 0);
    svg.appendChild(track); svg.appendChild(arc);
    var numEl = h('div', { class: 'dial-num', role: 'timer', 'aria-atomic': 'true',
      'aria-label': opts.label || 'Time remaining', text: opts.text || '0' });
    d.appendChild(svg); d.appendChild(numEl);
    d.update = function (fraction, text, final) {
      var f = U.clamp(fraction, 0, 1);

      if (numEl.textContent !== text) {

        numEl.classList.toggle('long', text.length > 3);
      }
      d.classList.toggle('is-final', !!final);
    };
    return d;
  }

  function nextUpText(blk, b) {

      var slot = blk.items[b.slotIndex || 0];
      if (b.setIndex >= slot.sets) return 'Next block';
      return (blk.mode === 'carry' ? 'Trip ' : 'Set ') + (b.setIndex + 1) + ' of ' + slot.sets + ' · ' +
        fmtLoad(b.draft.load, b.draft.unit) + (b.draft.reps ? ' × ' + b.draft.reps : '');
    }
    if (blk.mode === 'rounds') {
      var it = blk.items[b.itemIndex];

    Object.keys(byEx).forEach(function (id) {
      var ex = S().exercises[id];
      var rows = h('div', { class: 'stack-2' });
      byEx[id].forEach(function (e) {
        var txt = (e.isWarmup ? 'Warm-up · ' : '') + (e.load === null || e.load === undefined ? '' : U.num(e.load, e.load % 1 ? 1 : 0) + ' ' + e.loadUnit + ' ') +
          (e.reps !== null ? '× ' + e.reps : e.distanceM ? '× ' + e.distanceM + ' m' : e.seconds ? e.seconds + ' s' : '') + (e.rpe ? ' @' + e.rpe : '');
        var editable = e.reps !== null && e.reps !== undefined;
        rows.appendChild(h('button', { class: 'editrow', type: 'button', disabled: editable ? null : true,
          'aria-label': 'Edit set: ' + (ex ? ex.name : id) + ' ' + txt,
          onclick: function () { s.close(); editPastSet(sess.id, (sess.entries || []).indexOf(e)); } },
          h('span', { text: txt }), editable ? h('span', { class: 'meta', text: 'Edit' }) : null));
      });
      body.push(h('div', { class: 'stack-2' }, h('div', { class: 'cap', text: ex ? ex.name : id }), rows));
    });
    var note = h('textarea', { placeholder: 'Add a note…', 'aria-label': 'Session note' });
    note.value = sess.notes || '';
    note.addEventListener('input', function () {
      var v = note.value;
      AC.store.update(function (st) { var x = st.sessions.filter(function (q) { return q.id === sess.id; })[0]; if (x) x.notes = v; });
    });
    body.push(h('label', { class: 'field' }, h('span', { class: 'meta', text: 'Note' }), note));
    var s = ui.sheet({ title: 'Day ' + day.letter, body: body, actions: [
      ui.btn('Delete this session', function () {
        s.close();
        ui.confirm({ title: 'Delete this session?', message: 'This cannot be undone.', confirmLabel: 'Delete' })
          .then(function (ok) {
            if (!ok) return;
            AC.store.update(function (st) { st.sessions = st.sessions.filter(function (x) { return x.id !== sess.id; }); });
            render();
          });
      }, 'danger', { small: true })] });
  }

  /* Edit a past set (load and reps), then recompute the session's volume. */
  function editPastSet(sessionId, index) {
    var sess = S().sessions.filter(function (x) { return x.id === sessionId; })[0];
    var e = sess && sess.entries[index];
    if (!e) return;
    var load = e.load || 0, reps = e.reps || 0;
    var ex = S().exercises[e.exerciseId] || { name: e.exerciseId };
    var body = [];
    if (e.load !== null && e.load !== undefined) body.push(ui.stepper({ label: 'Load', unit: e.loadUnit, value: load, step: e.loadUnit === 'kg' ? 2.5 : 5, decimals: 1, min: 0, max: 1200, size: 'sm', onChange: function (v) { load = v; } }));
    body.push(ui.stepper({ label: 'Reps', value: reps, step: 1, min: 0, max: 100, size: 'sm', onChange: function (v) { reps = v; } }));
    var sh = ui.sheet({ title: ex.name + ' · set ' + (e.setIndex + 1), body: body, actionsGrid: true, actions: [
      ui.btn('Cancel', function () { sh.close(); sessionSheet(S().sessions.filter(function (x) { return x.id === sessionId; })[0]); }, 'ghost'),
      ui.btn('Save', function () {
        AC.store.update(function (st) {
          var x = st.sessions.filter(function (q) { return q.id === sessionId; })[0];
          var en = x.entries[index];
          if (en.load !== null && en.load !== undefined) en.load = load;
          en.reps = reps;
          en.editedAt = new Date().toISOString();
          if (x.totals) x.totals.volumeLb = Math.round(AC.stats.sessionVolume(x));
        });
        sh.close(); ui.toast('Set updated.'); render();
        sessionSheet(S().sessions.filter(function (x) { return x.id === sessionId; })[0]);
      }, 'primary')] });
  }

  /* ---------- settings ---------- */
  function doExport(includeClips) {
    AC.store.exportJSON({ includeClips: includeClips === true }).then(function (json) {
      var name = 'athletic-cut-' + U.todayKey() + '.json';
      var kb = Math.max(1, Math.round(json.length / 1024));
      var box = h('textarea', { readonly: true, 'aria-label': 'Backup contents',
        style: 'font-family:var(--font-mono);font-size:12px;min-height:110px' });
      box.value = json;
      var n = S().sessions.length;
      var sh = ui.sheet({
        title: 'Export backup',
        body: [
          h('p', { class: 'hint', text: kb + ' KB · ' + n + ' session' + (n === 1 ? '' : 's') +
            '. Save the file, or copy it somewhere you will find it again.' }),
          h('label', { class: 'field' }, box)
        ],
        actionsGrid: true,
        actions: [
          ui.btn('Copy', function () {
            AC.io.copyText(json, box).then(function (ok) {
              if (ok) { sh.close(); ui.toast('Backup copied to the clipboard.'); }
              else ui.toast('Select the text above and copy it.', 4000);
            });
          }, 'ghost'),
          ui.btn('Save file', function () {
            AC.io.download(name, json);
            sh.close();
            ui.toast('If nothing downloaded, use Copy instead.', 4000);
          }, 'primary')
        ]
      });
    });
  }
  /* The week as one document you can paste into a chat. Copy is the primary
     action: a sandboxed page cannot always start a download, and pasting is
     what this is for. */
  function weeklyReport(offset) {
    offset = offset || 0;
    var box = h('textarea', { readonly: true, 'aria-label': 'Weekly report',
      style: 'font-family:var(--font-mono);font-size:12px;min-height:180px' });
    var caption = h('p', { class: 'hint' });
    function load(o) {
      offset = o;
      box.value = AC.report.weekly(offset);
      var kb = Math.max(1, Math.round(box.value.length / 1024));
      caption.textContent = kb + ' KB of Markdown. Copy it, then paste it into Claude and ask how the week went.';
      picker.replaceWith(buildPicker());
    }
    function buildPicker() {
      picker = ui.segmented({ label: 'Week', value: String(offset),
        options: [{ id: '0', label: 'This week' }, { id: '-1', label: 'Last week' }, { id: '-2', label: '2 weeks ago' }],
        onChange: function (v) { load(+v); } });
      return picker;
    }
    var picker = ui.segmented({ label: 'Week', value: String(offset),
      options: [{ id: '0', label: 'This week' }, { id: '-1', label: 'Last week' }, { id: '-2', label: '2 weeks ago' }],
      onChange: function (v) { load(+v); } });
    var sh = ui.sheet({
      title: 'Weekly report',
      body: [picker, caption, h('label', { class: 'field' }, box)],
      actionsGrid: true,
      actions: [
        ui.btn('Save file', function () {
          AC.io.download(AC.report.filename(offset), box.value);
          ui.toast('If nothing downloaded, use Copy.', 4000);
        }, 'ghost'),
        ui.btn('Copy', function () {
          AC.io.copyText(box.value, box).then(function (ok) {
            if (ok) { sh.close(); ui.toast('Report copied — paste it into Claude.', 4000); }
            else ui.toast('Select the text above and copy it.', 4000);
          });
        }, 'primary')
      ]
    });
    load(offset);
    return sh;
  }

  function doImport() {
    AC.io.pickFile('application/json,.json').then(function (f) {
      if (!f) return;
      return AC.io.readText(f).then(function (text) {
        var sum = AC.store.summary(text);
        if (!sum) {
          ui.sheet({ title: "That file isn't a backup", body: [h('p', { text: 'It has no Athletic Cut marker. Nothing was changed.' })] });
          return;
        }
        ui.confirm({ title: 'Replace all data?',
          message: 'Backup from ' + sum.date + ' — ' + sum.sessions + ' sessions, ' + sum.metrics + ' metric entries' +
            (sum.clips ? ', ' + sum.clips + ' clips' : '') + '. Your current data is replaced.',
          confirmLabel: 'Replace' }).then(function (ok) {
            if (!ok) return;
            AC.store.importJSON(text).then(function (r) {
              if (!r.ok) { ui.sheet({ title: 'Import failed', body: [h('p', { text: r.error })] }); return; }
              ui.toast('Backup restored.');
              AC.router.go('home');
              render();
            }, function (e) {
              ui.sheet({ title: 'Import failed',
                body: [h('p', { text: 'Nothing was changed. ' + (e && e.message ? e.message : e) })] });
            });
          });
      });
    });
  }
  function settings() {
    var st = S(), s2 = st.settings;
    var el = screen({ title: 'More', nav: true });
    var body = h('div', { class: 'stack scroll' });
    function upd(fn) { AC.store.update(function (s) { fn(s.settings); }); }
    function group(title) { return h('h2', { class: 'grouptitle', text: title }); }
    body.appendChild(group('Workout'));
    body.appendChild(h('div', { class: 'stack-2' }, h('span', { class: 'cap', text: 'Units' }),
      ui.segmented({ value: s2.loadUnit, options: [{ id: 'lb', label: 'lb' }, { id: 'kg', label: 'kg' }],
        onChange: function (v) { upd(function (x) { x.loadUnit = v; x.bodyweightUnit = v; }); render(); } })));
    var lbU = s2.loadUnit !== 'kg';
    body.appendChild(h('div', { class: 'stack-2' }, h('span', { class: 'cap', text: 'Plate calculator' }),
      ui.stepper({ label: 'Bar weight', unit: s2.loadUnit, value: lbU ? s2.barWeightLb : s2.barWeightKg, step: lbU ? 5 : 2.5, decimals: 1, min: 0, max: 100, size: 'xs',
        onChange: function (v) { upd(function (x) { if (lbU) x.barWeightLb = v; else x.barWeightKg = v; }); } }),
      ui.stepper({ label: 'Trap bar weight', unit: s2.loadUnit, value: lbU ? s2.trapBarWeightLb : s2.trapBarWeightKg, step: lbU ? 5 : 2.5, decimals: 1, min: 0, max: 150, size: 'xs',
        onChange: function (v) { upd(function (x) { if (lbU) x.trapBarWeightLb = v; else x.trapBarWeightKg = v; }); } }),
      h('span', { class: 'meta', text: 'Plates you have (per side)' }),
      (function () {
        var all = lbU ? [55, 45, 35, 25, 15, 10, 5, 2.5, 1.25] : [25, 20, 15, 10, 5, 2.5, 2, 1.25, 0.5];
        var have = lbU ? s2.platesLb : s2.platesKg;
        var row = h('div', { class: 'chips' });
        all.forEach(function (pl) {
          var b = h('button', { class: 'chip chip--sm', type: 'button', 'aria-pressed': have.indexOf(pl) >= 0 ? 'true' : 'false', text: String(pl) });
          b.addEventListener('click', function () {
            upd(function (x) { var l = lbU ? x.platesLb : x.platesKg; var i = l.indexOf(pl); if (i >= 0) l.splice(i, 1); else l.push(pl); l.sort(function (a, c) { return c - a; }); });
            b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
          });
          row.appendChild(b);
        });
        return row;
      })()));
    body.appendChild(ui.toggle('Rest timer sound', s2.sound, function (v) { upd(function (x) { x.sound = v; }); },
      'On iPhone, sound plays while the screen is on.'));
    body.appendChild(ui.toggle('Haptics', s2.vibrate, function (v) { upd(function (x) { x.vibrate = v; }); }));
    body.appendChild(ui.toggle('Keep screen awake in session', s2.wakeLock, function (v) {
      upd(function (x) { x.wakeLock = v; });
      if (!v) AC.wake.release();
    }, AC.wake.supported() ? null : 'This browser cannot hold the screen awake — set it in system settings.'));
    body.appendChild(ui.toggle('Suggest a load bump when RPE was skipped', s2.assumeRpe8WhenSkipped,
      function (v) { upd(function (x) { x.assumeRpe8WhenSkipped = v; }); },
      'Off by default: a suggestion needs positive evidence.'));
    body.appendChild(h('div', { class: 'stack-2' }, h('span', { class: 'cap', text: 'Progression rule' }),
      ui.segmented({ value: s2.progressionRule,
        options: [{ id: 'final-set', label: 'Final set' }, { id: 'all-sets', label: 'All sets' }],
        onChange: function (v) { upd(function (x) { x.progressionRule = v; }); render(); } }),
      h('p', { class: 'hint', text: 'When to suggest more weight: the final set hit the top of the range, or every set did.' })));
    body.appendChild(h('div', { class: 'stack-2' }, h('span', { class: 'cap', text: 'Daily targets' }),
      ui.stepper({ label: 'Calories', unit: 'kcal', value: s2.calorieTarget, step: 50, min: 1200, max: 6000, size: 'xs',
        onChange: function (v) { upd(function (x) { x.calorieTarget = v; }); } }),
      ui.stepper({ label: 'Protein floor', unit: 'g', value: s2.proteinMinG, step: 5, min: 60, max: 400, size: 'xs',
        onChange: function (v) { upd(function (x) { x.proteinMinG = v; }); } }),
      ui.stepper({ label: 'Step floor', value: s2.stepsMin, step: 500, min: 1000, max: 30000, size: 'xs',
        onChange: function (v) { upd(function (x) { x.stepsMin = v; }); } })));
    body.appendChild(group('Appearance'));
    body.appendChild(h('div', { class: 'stack-2' }, h('span', { class: 'cap', text: 'Theme' }),
      ui.segmented({ value: s2.theme, options: [{ id: 'system', label: 'System' }, { id: 'dark', label: 'Dark' }, { id: 'light', label: 'Light' }],
        onChange: function (v) { upd(function (x) { x.theme = v; }); applyTheme(); render(); } })));
    body.appendChild(ui.toggle('Left-handed layout', s2.leftHanded, function (v) {
      upd(function (x) { x.leftHanded = v; }); applyHand(); },
      'Puts the + cell of every stepper under your left thumb.'));
    body.appendChild(h('div', { class: 'stack-2' }, h('span', { class: 'cap', text: 'Reduce motion' }),
      ui.segmented({ value: s2.reduceMotion,
        options: [{ id: 'system', label: 'System' }, { id: 'on', label: 'On' }, { id: 'off', label: 'Off' }],
        onChange: function (v) { upd(function (x) { x.reduceMotion = v; }); render(); } })));
    body.appendChild(group('Data'));
    body.appendChild(h('button', { class: 'listrow', type: 'button', onclick: function () { weeklyReport(0); } },
      h('div', { class: 'listrow-main' },
        h('div', { class: 'listrow-title', text: 'Export weekly report' }),
        h('div', { class: 'listrow-sub', text: 'Markdown: sessions, loads, bodyweight and food, ready to paste' })),
      use('i-right')));
    body.appendChild(h('button', { class: 'listrow', type: 'button', onclick: function () { doExport(false); } },
      h('div', { class: 'listrow-main' }, h('div', { class: 'listrow-title', text: 'Export data (JSON)' }),
        h('div', { class: 'listrow-sub', text: 'Everything except video clips' })), use('i-right')));
    body.appendChild(h('button', { class: 'listrow', type: 'button', onclick: function () { doExport(true); } },
      h('div', { class: 'listrow-main' }, h('div', { class: 'listrow-title', text: 'Export with video clips' }),
        h('div', { class: 'listrow-sub', text: 'Much larger file' })), use('i-right')));
    body.appendChild(h('button', { class: 'listrow', type: 'button', onclick: doImport },
      h('div', { class: 'listrow-main' }, h('div', { class: 'listrow-title', text: 'Import a backup' }),
        h('div', { class: 'listrow-sub', text: 'Replaces everything on this device' })), use('i-right')));
    body.appendChild(h('button', { class: 'listrow', type: 'button', onclick: function () { AC.router.go('history'); } },
      h('div', { class: 'listrow-main' }, h('div', { class: 'listrow-title', text: 'History' })), use('i-right')));
    body.appendChild(h('button', { class: 'listrow', type: 'button', onclick: function () { AC.router.go('nutrition'); } },
      h('div', { class: 'listrow-main' }, h('div', { class: 'listrow-title', text: 'Nutrition' })), use('i-right')));
    var bytes = 0;
    try { bytes = (localStorage.getItem(AC.store.LS_KEY) || '').length; } catch (e) {}
    body.appendChild(h('div', { class: 'hint', text: 'Storage used: ' + Math.round(bytes / 1024) + ' KB · ' +
      st.sessions.length + ' session' + (st.sessions.length === 1 ? '' : 's') }));
    body.appendChild(h('div', { class: 'divider' }));
    body.appendChild(ui.btn('Delete all data', function () {
      ui.confirm({ title: 'Delete everything?', message: 'Every session, metric and setting on this device. Export a backup first if you want one.',
        confirmLabel: 'Delete all' }).then(function (ok) {
          if (!ok) return;
          ui.confirm({ title: 'Really delete everything?', message: 'This cannot be undone.', confirmLabel: 'Yes, delete' })
            .then(function (ok2) {
              if (!ok2) return;
              AC.store.reset();
              AC.router.go('home');
              render();
            });
        });
    }, 'danger', { small: true }));
    body.appendChild(h('div', { class: 'hint', style: 'text-align:center',
      text: 'Athletic Cut · v2.0 · offline · no accounts · no tracking' }));
    el.appendChild(body);
    el.appendChild(navbar('more'));
    return el;
  }

  /* ---------- render ---------- */
  function applyHand() {
    document.documentElement.setAttribute('data-hand', S().settings.leftHanded ? 'left' : 'right');
  }
  function applyTheme() {
    var t = S().settings.theme;
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }
  function render() {
    var st = S();
    var cur = AC.router.parse();
    var route = cur.route;
    if (!st.onboarded && route !== 'more') route = 'onboarding';
    if (st.activeSession && route === 'session') { /* ok */ }
    else if (!st.activeSession && route === 'session') route = 'home';
    var node;
    refs = {};
    try {
      node = build(route, cur);
    } catch (err) {
      node = recovery(err);
    }
    U.clear(app());
    app().appendChild(node);
    if (route !== prevRoute || cur.param !== prevParam) { window.scrollTo(0, 0); ui.hideToast(); }
    prevRoute = route; prevParam = cur.param;
    tickUI();
  }

  function build(route, cur) {
    var node;
    switch (route) {
      case 'onboarding': node = onboarding(); break;
      case 'session': node = sessionScreen(); break;
      case 'summary': node = summaryScreen(); break;
      case 'library': node = library(); break;
      case 'exercise': node = exerciseScreen(cur.param); break;
      case 'progress': node = progress(); break;
      case 'body': node = bodyScreen(); break;
      case 'nutrition': node = nutrition(); break;
      case 'history': node = history(); break;
      case 'more': node = settings(); break;
      default: node = home();
    }
    return node;
  }

  /* Last line of defence: a screen that always renders, so damaged data is
     never a blank page with no way out. */
  function recovery(err) {
    var el = screen({ nav: false });
    el.appendChild(h('div', { class: 'stack', style: 'padding-top:8vh' },
      h('h1', { class: 'screen-title', text: 'Something in your data is broken' }),
      h('p', { style: 'color:var(--text-2)',
        text: 'The app could not draw this screen. Export a backup first, then clear what is stuck.' }),
      h('p', { class: 'hint', style: 'font-family:var(--font-mono)', text: String(err && err.message || err) }),
      ui.btn('Export a backup', function () { doExport(false); }, 'primary'),
      ui.btn('Discard the in-progress session', function () {
        AC.store.update(function (s) { s.activeSession = null; });
        AC.router.go('home'); render();
      }, 'outline', { small: true }),
      ui.btn('Reset everything', function () {
        ui.confirm({ title: 'Reset everything?', message: 'Every session and metric on this device.', confirmLabel: 'Reset' })
          .then(function (ok) { if (ok) { AC.store.reset(); AC.router.go('home'); render(); } });
      }, 'danger', { small: true })));
    return el;
  }

  /* Per-frame updates that must not rebuild the DOM (timer digits, rings). */
  function tickUI() {
    var st = S(), a = st.activeSession;
    if (!a) return;
    var now = AC.ticker.now();
    if (a.timer && refs.restDial) {
      var total = refs.restTotal || 1;
      var remain = (a.timer.endAt - now) / 1000;
      var fired = remain <= 0;
      refs.restDial.update(U.clamp(remain / total, 0, 1), fired ? 'GO' : U.fmtClock(remain), remain <= 5);
      if (refs.restPanel) refs.restPanel.classList.toggle('is-go', fired);
    }
    if (a.timer && refs.restBarTime) {
      var r2 = (a.timer.endAt - now) / 1000;
      refs.restBarTime.textContent = r2 <= 0 ? 'GO' : U.fmtClock(r2);
      if (refs.restBar) refs.restBar.classList.toggle('is-go', r2 <= 0);
    }
    if (refs.emomDial && a.block && a.block.mode === 'emom' && a.block.status === 'running') {
      var el2 = (now - a.block.startedAt) / 1000;
      var into = el2 % 60;
      refs.emomDial.update(1 - into / 60, U.fmtClock(60 - into), 60 - into <= 5);
    }
    if (refs.holdDial && a.timer && a.timer.kind === 'hold') {
      var ht = (a.timer.endAt - a.timer.startedAt) / 1000;
      var hr = (a.timer.endAt - now) / 1000;
      refs.holdDial.update(U.clamp(hr / ht, 0, 1), U.fmtClock(hr), hr <= 3);
    }
    if (refs.intervalDial && a.timer) {
      var t3 = (a.timer.endAt - a.timer.startedAt) / 1000;
      var r3 = (a.timer.endAt - now) / 1000;
      refs.intervalDial.update(U.clamp(r3 / t3, 0, 1), U.fmtClock(r3), r3 <= 3);
    }
  }

  return { render: render, tickUI: tickUI, applyTheme: applyTheme, applyHand: applyHand, startFlow: startFlow,
    showProgram: programSheet, weeklyReport: weeklyReport,
    doExport: doExport, doImport: doImport, saveMetric: saveMetric,
    _setRestCollapsed: function (v) { restCollapsed = v; } };
})();

/* --------------------------------------------------------------------------
   17. boot
   -------------------------------------------------------------------------- */
(function boot() {
  AC.store.load();
  AC.screens.applyTheme();
  AC.screens.applyHand();
  AC.audio.installUnlockListener();
  AC.wake.bind();
  AC.engine.onChange(function () { AC.screens.render(); });
  AC.router.onChange(function () { AC.screens.render(); });
  AC.ticker.on(function () { AC.engine.tick(); AC.screens.tickUI(); });
  AC.ticker.start();
  document.addEventListener('ac:writestate', function () { AC.screens.render(); });

  var st = AC.store.get();
  if (st.activeSession) {
    AC.engine.resume();
    if (!location.hash || location.hash === '#/home') location.hash = '#/session';
  }
  AC.screens.render();

  /* Reconcile clip references with what IndexedDB actually holds — after first paint. */
  setTimeout(function () {
    AC.media.listClipIds().then(function (ids) {
      var map = {};
      ids.forEach(function (i) { map[i] = true; });
      var changed = false;
      AC.store.update(function (s) {
        Object.keys(s.exercises).forEach(function (k) {
          var want = map[k] ? k : null;
          if (s.exercises[k].userClipRef !== want) { s.exercises[k].userClipRef = want; changed = true; }
        });
      });
      if (changed) AC.screens.render();
    });
  }, 0);
})();
</script>
