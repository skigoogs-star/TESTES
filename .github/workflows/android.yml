name: Android CI

on:
  push:
    paths:
      - 'deckrec-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # A hung Gradle would otherwise sit here for the full six-hour default before anyone noticed.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deckrec-android

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run DSP regression tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/DeckRec-debug-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeckRec-debug-apk
          path: deckrec-android/out/*.apk
          if-no-files-found: error
          retention-days: 30
