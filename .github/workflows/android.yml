name: Android CI

on:
  push:
    paths:
      - 'deckrec-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Backstop only. The per-step timeouts below should always fire first and, unlike this one,
    # they leave thread dumps in the log rather than having the runner kill everything silently.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deckrec-android

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Default is read-only off the default branch, which means every feature-branch run
          # re-resolves the whole dependency graph over the network.
          cache-read-only: false
          cache-cleanup: on-success

      # The native USB capture backend needs an NDK and a CMake. Neither can be downloaded here —
      # dl.google.com is unreachable from this project's sandbox — so the build reads whatever the
      # runner image already ships. This step is what tells us what that is, and it is permanent:
      # when the image is trimmed and the native build breaks, the answer is already in the log.
      - name: Toolchain sanity
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-unset}"
          echo "--- $ANDROID_HOME/ndk ---";   ls -1 "$ANDROID_HOME/ndk"   2>&1 || true
          echo "--- $ANDROID_HOME/cmake ---"; ls -1 "$ANDROID_HOME/cmake" 2>&1 || true
          echo "--- system cmake ---"
          command -v cmake && cmake --version || echo "no cmake on PATH"
          echo "--- system ninja ---"
          command -v ninja && ninja --version || echo "no ninja on PATH"

      - name: Start hang watchdog
        run: |
          nohup bash -c '
            sleep 720
            exec > "$RUNNER_TEMP/watchdog-dump.txt" 2>&1
            echo "=== watchdog fired $(date -u) ==="
            free -h; echo
            ps auxww --sort=-rss | head -40; echo
            for pid in $(pgrep -f "[j]ava"); do
              echo "--- jstack $pid ---"
              jstack "$pid" || true
            done
          ' >/dev/null 2>&1 &
          echo "watchdog armed"

      - name: Run DSP regression tests
        timeout-minutes: 15
        run: |
          set -uo pipefail
          run_gradle() { timeout --kill-after=60 10m ./gradlew --stacktrace --console=plain "$@"; }
          run_gradle :app:testDebugUnitTest && exit 0
          status=$?
          # 124/137 mean the watchdog killed a wedged JVM. Anything else is a real test failure and
          # must not be retried into a false green.
          if [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then exit "$status"; fi
          echo "::warning::Gradle hung. Dumping stacks, killing daemons, retrying once."
          for pid in $(pgrep -f '[j]ava' || true); do echo "--- jstack $pid ---"; jstack "$pid" || true; done
          free -h
          ./gradlew --stop || true
          pkill -9 -f KotlinCompileDaemon || true
          pkill -9 -f aapt2 || true
          run_gradle :app:testDebugUnitTest

      - name: Assemble debug APK
        timeout-minutes: 15
        run: |
          set -uo pipefail
          run_gradle() { timeout --kill-after=60 10m ./gradlew --stacktrace --console=plain "$@"; }
          run_gradle :app:assembleDebug && exit 0
          status=$?
          if [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then exit "$status"; fi
          echo "::warning::Gradle hung. Dumping stacks, killing daemons, retrying once."
          for pid in $(pgrep -f '[j]ava' || true); do echo "--- jstack $pid ---"; jstack "$pid" || true; done
          ./gradlew --stop || true
          pkill -9 -f KotlinCompileDaemon || true
          run_gradle :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/DeckRec-debug-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeckRec-debug-apk
          path: deckrec-android/out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-test-report
          path: deckrec-android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload hang diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-diagnostics
          path: ${{ runner.temp }}/watchdog-dump.txt
          if-no-files-found: ignore
          retention-days: 14
