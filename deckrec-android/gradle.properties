# Sized for a 2-core / 7 GB CI runner. The Gradle JVM, the Kotlin compile daemon and AAPT2 all run
# at once; giving Gradle 3g here left the machine thrashing and builds occasionally hung for an
# hour instead of finishing in three minutes.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
# Single module: parallel execution buys nothing and only adds memory pressure.
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
