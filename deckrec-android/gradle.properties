# Conservative JVM sizing: the Gradle JVM, the Kotlin compile daemon and AAPT2 all run at once.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom
kotlin.daemon.jvmargs=-Xmx1g -Djava.security.egd=file:/dev/./urandom
# Single module: parallel execution buys nothing and only adds memory pressure.
org.gradle.parallel=false
org.gradle.caching=true

# Fail fast and retry on a flaky repository connection rather than stalling silently. Gradle's
# defaults do not cover a slow-drip connection, which is indistinguishable from a hang in CI.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=500

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
