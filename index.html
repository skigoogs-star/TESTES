<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Apps</title>
  <script>
    // A Retro Cam icon installed before the app moved to retro-cam/ still
    // opens this address. When launched from the home screen, go straight on.
    if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
      location.replace('retro-cam/');
    }
  </script>
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #16171a; --muted: #5d6068; --card: #ffffff; --line: #e2e0da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111214; --fg: #f1f0ec; --muted: #a2a5ad; --card: #1b1c1f; --line: #2c2d31; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 32rem; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 1.75rem; margin: 0 0 24px; }
    a.app { display: block; padding: 18px 20px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; }
    a.app:active { transform: scale(0.99); }
    a.app strong { display: block; font-size: 1.15rem; }
    a.app span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Apps</h1>
    <a class="app" href="retro-cam/">
      <strong>Retro Cam</strong>
      <span>Camera with retro film filters</span>
    </a>
    <a class="app" href="athletic-cut/">
      <strong>Athletic Cut</strong>
      <span>Training program, timers and logging</span>
    </a>
    <a class="app" href="aloud/">
      <strong>Aloud</strong>
      <span>Reads any text or PDF out loud</span>
    </a>
    <a class="app" href="https://github.com/skigoogs-star/TESTES/releases/tag/latest">
      <strong>DeckRec</strong>
      <span>Android app for recording a DJ mixer. Opens the download page.</span>
    </a>
  </main>
</body>
</html>
